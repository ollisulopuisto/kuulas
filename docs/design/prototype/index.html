<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>kuulas prototype</title>
<!--
  kuulas GUI prototype: the visual source of truth for docs/design/GUI-DESIGN.md.
  One offline file, fake data, no audio at all (Space only animates the playhead).
  URL parameters (also set by the bar at the top):
    screen = main|transcript|crosstalk|history|candidates|recording|palette|compare|collapsed|focus|import-drop|import|menu|empty|error|gallery
    theme = system | light | dark     lang = en | fi     density = comfortable | compact
    width = auto | 1024 | 1280 | 1440 | 1920 | 2560   motion = full | subtle | off
    clean = 1   hides the prototype bar (used for the screenshots)
  The token block and the module copies below are generated: never edit them
  here, run  after changing ui/.
-->
<script>
// Before first paint: density, theme and motion from the URL, so nothing
// re-lays out after the page appears.
(() => { const q = new URLSearchParams(location.search), r = document.documentElement;
  if (q.get("density") === "compact") r.dataset.density = "compact";
  if (["light", "dark"].includes(q.get("theme"))) r.dataset.theme = q.get("theme");
  r.dataset.motion = q.get("motion") || "full";
  if (q.get("clean") === "1") r.classList.add("clean"); })();
</script>

/* kuulas design tokens. The single source of colour, type, spacing, motion
   and size for the editor (style.css) and its canvases (grammar.js names the
   tokens, theme.js resolves them once per theme change). Three layers:

   1. PRIMITIVES  --p-<family>-<lightness>   raw colours, named by OKLCH
      lightness (0-100), "-aNN" = alpha NN %. Theme-independent. Only the
      theme blocks (layer 2) may reference them.
   2. SEMANTIC    --surface-*, --text-*, --accent*, --signal-*, --track-*,
      --bus-*, --role-*, --label-* ...   what a colour MEANS. Set per theme,
      only as var(--p-...) (or a number). grammar.js SEMANTIC_TOKENS lists
      every one; tokens.test.js fails if a theme misses one.
   3. COMPONENT   --button-bg, --lane-bg ...   per component, only as
      var(--semantic). style.css uses layers 2 and 3, never layer 1.

   A theme is a set of layer-2 overrides (the light and dark blocks below;
   user themes are JSON manifests, see GUI-DESIGN.md "Themes"). Spec:
   docs/design/GUI-DESIGN.md. Visual reference: docs/design/prototype/
   (it embeds a copy of this file: run node docs/design/sync-tokens.mjs).
   tokens.test.js checks contrast (WCAG AA) for every pair in both themes. */

/* == theme-independent: type, spacing, radii, motion, sizes ============== */
:root {
  /* Type. System fonts: native feel, no download, full Finnish coverage. */
  --font-ui:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
    system-ui, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --font-mono:
    ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  /* Comfortable (the default, roomy since 2026-10-18); compact below keeps
     the earlier, denser values. Numbers: GUI-DESIGN.md "Density". */
  --text-xs: 12px; /* ruler labels, badges, key chips */
  --text-sm: 13px; /* controls, panel headers, meta */
  --text-md: 14px; /* body: the default */
  --text-lg: 17px; /* transcript reading text, dialog titles */
  --text-xl: 24px; /* the timecode */
  --leading-tight: 1.25;
  --leading-body: 1.5;
  --leading-read: 1.85; /* transcript */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;

  /* Spacing: a 4 px grid with two half steps for dense rows. */
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 6px;
  --space-4: 8px;
  --space-5: 12px;
  --space-6: 16px;
  --space-7: 24px;
  --space-8: 32px;

  /* Radii. Clips are square (canvas); everything the hand touches is soft. */
  --radius-xs: 2px; /* badges on clips, key chips */
  --radius-sm: 4px; /* buttons, inputs, chips in toolbars */
  --radius-md: 6px; /* popovers, cards, list rows */
  --radius-lg: 10px; /* dialogs, the command palette */
  --radius-pill: 999px; /* state chips */

  /* Motion. Short and functional; prefers-reduced-motion sets them to 0. */
  --dur-fast: 90ms; /* hover, press */
  --dur-base: 140ms; /* chips appearing, tabs */
  --dur-layout: 120ms; /* lane height changes, focus mode shrink (WP28) */
  --dur-slow: 240ms; /* a ripple closing its gap, tracks arriving, a far playhead jump */
  --dur-flash: 600ms; /* "this changed" flash after undo/redo */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);

  /* Focus ring: always visible on keyboard focus, never removed. */
  --focus-width: 2px;
  --focus-offset: 2px;

  /* Layout sizes (comfortable density). JS constants that must match are
     named next to each. */
  --topbar-h: 52px;
  --statusbar-h: 32px;
  --corner-h: 72px; /* the transport corner above the track headers = overview + ruler */
  --overview-h: calc(var(--corner-h) - var(--ruler-h));
  --ruler-h: 24px; /* lanes.js RULER_HEIGHT (both densities) */
  --heads-w: 340px; /* as wide as the corner: Play, timecode and the in/out readout */
  --heads-w-min: 280px;
  --heads-w-max: 380px;
  --sidebar-w: 360px;
  --sidebar-w-min: 280px;
  --sidebar-w-max: 520px;
  --dock-h: 26vh; /* transcript dock */
  --dock-h-min: 140px;
  --control-h: 32px; /* buttons, inputs, selects */
  --control-h-lg: 40px; /* top-bar buttons: 40 visible + 2 px hit margin = 44 */
  --control-h-sm: 28px; /* M / S, bus picker, chips inside headers */
  --target-min: 44px; /* hit target of the main controls (WCAG 2.5.5) */
  --lane-h: 80px; /* lanes.js DEFAULT_LANE */
  --bus-h: 60px; /* lanes.js BUS_HEIGHT: a name line and a level line */
  --bus-collapsed-h: 40px; /* a collapsed bus: ribbons or summed waveform */
  --group-gap: 14px; /* lanes.js GROUP_GAP: plain lane between groups */
  --strip-h: 16px; /* focus-mode strips (WP28) */
  --spine-w: 4px; /* bus spine */
  --indent-member: 14px; /* tracks inside a bus sit this far in from the spine */
  --reading-max: 62ch; /* transcript line length */
  --pad-panel: 20px; /* inside panels and sections */
  --pad-inline: 16px; /* left/right padding of headers and rows */
  --row-gap: 10px; /* between rows of fields and list items */
  --section-gap: 16px; /* between inspector sections */
  /* Numbers the canvases read with the colours (semantic, overridable). */
  --signal-muted-opacity: 0.35; /* muted clips (with the hatch) */
  --signal-unheard-opacity: 0.45; /* tracks not heard because of solo or mute */
  --signal-unused-opacity: 0.5; /* material not in the open edit (clip bin) */
  --signal-gate-opacity: 0.7; /* the gate veil: strong enough to read as closed */
}

:root[data-density="compact"] {
  /* Compact: the earlier values, unchanged; everything visible at once. */
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 12px;
  --text-lg: 14px;
  --text-xl: 18px;
  --leading-body: 1.45;
  --leading-read: 1.65;
  --topbar-h: 38px;
  --statusbar-h: 22px;
  --heads-w: 340px; /* the corner needs the same room in both densities */
  --heads-w-min: 280px;
  --heads-w-max: 360px;
  --sidebar-w: 280px;
  --sidebar-w-min: 260px;
  --sidebar-w-max: 480px;
  --dock-h: 30vh;
  --dock-h-min: 120px;
  --control-h: 22px;
  --control-h-lg: 26px;
  --control-h-sm: 18px;
  --target-min: 24px;
  --lane-h: 40px;
  --bus-h: 50px;
  --bus-collapsed-h: 32px;
  --group-gap: 6px;
  --reading-max: 72ch;
  --pad-panel: 12px;
  --pad-inline: 12px;
  --row-gap: 4px;
  --section-gap: 10px;
  --indent-member: 10px;
}

/* == 2. semantic roles: light (default) ================================= */
:root {
  color-scheme: light;
  --surface-app: var(--p-gray-79); /* behind everything; the 1 px gaps between docks */
  --surface-lane: var(--p-gray-89); /* timeline background */
  --surface-lane-current: var(--p-teal-87); /* the current track's lane and header (↑/↓ cursor) */
  --surface-panel: var(--p-gray-87); /* headers, panels, top and status bars */
  --surface-raised: var(--p-gray-94-c); /* popovers, palette, toasts (with --shadow-raised) */
  --surface-sunken: var(--p-gray-93-c); /* inputs, wells, key chips */
  --surface-hover: var(--p-gray-83);
  --surface-active: var(--p-gray-79-b); /* pressed controls, count pills */
  --surface-scrim: var(--p-gray-20-a32); /* behind modal dialogs */
  --border-subtle: var(--p-gray-79-c); /* lane separators, list dividers */
  --border: var(--p-gray-64); /* panel edges, controls at rest */
  --border-strong: var(--p-gray-49); /* input outlines: >= 3:1 on panels */
  --text: var(--p-gray-18-c);
  --text-secondary: var(--p-gray-30-b);
  --text-tertiary: var(--p-gray-37); /* still >= 4.5:1: body text, never decoration */
  --text-disabled: var(--p-gray-62); /* disabled only (exempt from contrast) */
  --text-on-accent: var(--p-gray-100);
  --accent: var(--p-teal-49); /* primary buttons, focus, range edges, the overview box */
  --accent-hover: var(--p-teal-44);
  --accent-text: var(--p-teal-38); /* accent-coloured text on panels */
  --accent-subtle: var(--p-teal-81); /* selected rows, selected words */

  --ruler-text: var(--p-gray-30-b);

/* == 3. component tokens: only var(--semantic) ========================== */
:root {
  --frame-gap: var(--border); /* the 1 px lines between top bar, docks and status bar */
  --toolbar-bg: var(--surface-panel);
  --panel-bg: var(--surface-panel);
  --panel-divider: var(--border-subtle);
  --header-bg: var(--surface-panel); /* track and bus headers */
  --header-bg-current: var(--surface-lane-current);
  --lane-bg: var(--surface-lane);
  --lane-separator: var(--border-subtle);
  --ruler-bg: var(--surface-panel);
  --button-bg: var(--surface-panel);
  --button-text: var(--text);
  --button-border: var(--border);
  --button-hover-bg: var(--surface-hover);
  --button-hover-border: var(--border-strong);
  --button-active-bg: var(--surface-active);
  --button-primary-bg: var(--accent); /* Play and the one primary action of a view */
  --button-primary-hover-bg: var(--accent-hover);
  --button-primary-text: var(--text-on-accent);
  --input-bg: var(--surface-sunken);
  --input-border: var(--border-strong);
  --kbd-bg: var(--surface-sunken); /* key chips */
  --kbd-border: var(--border);
  --kbd-text: var(--text-secondary);
  --toast-bg: var(--surface-raised);
  --toast-shadow: var(--shadow-raised);
  --mute-on-bg: var(--text-secondary); /* M pressed: neutral */
  --solo-on-bg: var(--warn); /* S pressed: amber, and a 'Solo' chip in the top bar */
}

/* -- reduced motion: no animation anywhere ------------------------------- */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"], [data-motion="subtle"]) {
    --dur-fast: 0ms;
    --dur-base: 0ms;
    --dur-layout: 0ms;
    --dur-slow: 0ms;
    --dur-flash: 0ms;
  }
}
/* The Animation setting (motion.js): subtle shortens, off stops every cue;
   the still alternatives carry the same information. */
:root[data-motion="subtle"] {
  --dur-base: 90ms;
  --dur-slow: 140ms;
  --dur-flash: 360ms;
  --dur-layout: 80ms;
}
:root[data-motion="off"] {
  --dur-fast: 0ms;
  --dur-base: 0ms;
  --dur-layout: 0ms;
  --dur-slow: 0ms;
  --dur-flash: 0ms;
}

/* ===== base ============================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: #000;
  color: var(--text);
  font: var(--weight-regular) var(--text-md) / var(--leading-body) var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
kbd {
  display: inline-block; min-width: 18px; padding: 0 4px; height: 18px;
  font: var(--weight-medium) 11px/16px var(--font-ui); text-align: center;
  color: var(--kbd-text); background: var(--kbd-bg);
  border: 1px solid var(--kbd-border); border-bottom-width: 2px; border-radius: var(--radius-xs);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.spacer { flex: 1; }

/* ===== buttons and chips ================================================= */
.button {
  position: relative; display: inline-flex; align-items: center; gap: var(--space-3);
  height: var(--control-h); padding: 0 var(--pad-inline);
  border: 1px solid var(--button-border); border-radius: var(--radius-sm);
  background: var(--button-bg); color: var(--button-text); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
}
.button:hover:not(:disabled) { background: var(--button-hover-bg); border-color: var(--button-hover-border); }
.button:active:not(:disabled) { background: var(--button-active-bg); }
.button:disabled { color: var(--text-disabled); cursor: default; }
.button.primary { background: var(--button-primary-bg); border-color: var(--button-primary-bg); color: var(--button-primary-text); font-weight: var(--weight-strong); }
.button.primary:hover:not(:disabled) { background: var(--button-primary-hover-bg); border-color: var(--button-primary-hover-bg); }
.button.ghost { border-color: transparent; background: transparent; }
.button.ghost:hover:not(:disabled) { background: var(--surface-hover); border-color: transparent; }
.button.small { height: var(--control-h-sm); padding: 0 var(--space-4); font-size: var(--text-sm); }
.icon-button { width: var(--control-h); padding: 0; justify-content: center; }
.chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: calc(var(--control-h-sm) - 2px); padding: 0 var(--space-4); border-radius: var(--radius-pill);
  font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap;
  border: 1px solid var(--border); color: var(--text-secondary); background: transparent;
}
.chip svg.i { width: 14px; height: 14px; }
.chip.warn { background: var(--warn-subtle); border-color: var(--warn); color: var(--warn-text); }
.chip.danger { background: var(--danger-subtle); border-color: var(--danger); color: var(--danger-text); }
.chip.info { color: var(--text); border-color: var(--border-strong); }
button.chip { cursor: pointer; }
/* Key chips beside controls: on hover and keyboard focus only (comfortable). */
:root:not([data-density="compact"]) .keyed kbd { visibility: hidden; }
:root:not([data-density="compact"]) .keyed:is(:hover, :focus-visible, :focus-within) kbd { visibility: visible; }
.float-key { position: relative; }
:root:not([data-density="compact"]) .float-key kbd { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); z-index: 6; }

/* ===== prototype bar (not part of the design) ============================ */
.proto-bar { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #000; color: #ddd; font: 12px/1 system-ui, sans-serif; overflow-x: auto; white-space: nowrap; }
.proto-bar b { color: #fff; margin-right: 4px; }
.proto-bar select { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; height: 22px; }
.proto-bar .sep { width: 1px; height: 16px; background: #444; }
.proto-bar output { color: #8fe3cf; font-variant-numeric: tabular-nums; }
html.clean .proto-bar { display: none; }

/* ===== frame and window grid ============================================= */
.frame { height: calc(100vh - 30px); margin: 0 auto; background: var(--surface-app); overflow: hidden; }
/* Containment only for a chosen width (the prototype's width control); in auto
   mode the same breakpoints run as media queries (headless screenshots break
   under containment). */
.frame.sized { container: app / inline-size; }
html.clean .frame { height: 100vh; }
.app {
  height: 100%; display: grid; gap: 1px; background: var(--frame-gap);
  grid-template-columns: var(--heads-w) minmax(0, 1fr) var(--sidebar-w);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--dock-h) var(--statusbar-h);
  grid-template-areas: "top top top" "heads timeline side" "dock dock side" "status status status";
}
.app > * { background: var(--panel-bg); min-width: 0; min-height: 0; }
/* Window sizes: large caps the side columns, medium shrinks them, small moves
   the transcript into the right column (GUI-DESIGN.md "Window sizes"). */
@container app (min-width: 1920px) { .app { grid-template-columns: var(--heads-w) minmax(0, 1fr) min(var(--sidebar-w-max), 22cqw); } }
@container app (max-width: 1399px) { .app { grid-template-columns: var(--heads-w-min) minmax(0, 1fr) var(--sidebar-w-min); } .project { width: var(--heads-w-min) !important; } }
@container app (max-width: 1099px) {
  .app { grid-template-rows: var(--topbar-h) minmax(0, 1fr) minmax(0, 1fr) var(--statusbar-h); grid-template-areas: "top top top" "heads timeline dock" "heads timeline side" "status status status"; }
  .keyhints, .cmd-button .label, .job .label { display: none !important; }
  .app .para { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
  .app .speaker { flex-direction: row; gap: var(--space-4); align-items: baseline; }
}

@media (min-width: 1920px) { .frame:not(.sized) .app { grid-template-columns: var(--heads-w) minmax(0, 1fr) min(var(--sidebar-w-max), 22vw); } }
@media (max-width: 1399px) { .frame:not(.sized) .app { grid-template-columns: var(--heads-w-min) minmax(0, 1fr) var(--sidebar-w-min); } .frame:not(.sized) .project { width: var(--heads-w-min) !important; } }
@media (max-width: 1099px) {
  .frame:not(.sized) .app { grid-template-rows: var(--topbar-h) minmax(0, 1fr) minmax(0, 1fr) var(--statusbar-h); grid-template-areas: "top top top" "heads timeline dock" "heads timeline side" "status status status"; }
  .frame:not(.sized) .keyhints, .cmd-button .label, .job .label { display: none !important; }
  .frame:not(.sized) .app .para { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
  .frame:not(.sized) .app .speaker { flex-direction: row; gap: var(--space-4); align-items: baseline; }
}

/* ===== top bar =========================================================== */
.topbar { grid-area: top; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--pad-inline) 0 0; }
.topbar .button { height: var(--control-h-lg); }
.topbar .button::after { content: ""; position: absolute; inset: calc((var(--control-h-lg) - var(--target-min)) / 2) -2px; }
.topbar .icon-button { width: var(--control-h-lg); }
.project { width: var(--heads-w); flex: none; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--pad-inline); border-right: 1px solid var(--border-subtle); min-width: 0; cursor: pointer; }
.project:hover { background: var(--surface-hover); }
.project .name { font-weight: var(--weight-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: var(--leading-tight); }
.project .edit { font-size: var(--text-xs); color: var(--text-secondary); display: flex; gap: var(--space-2); align-items: center; white-space: nowrap; overflow: hidden; }
.project .edit svg.i { width: 12px; height: 12px; }
.transport { display: flex; align-items: center; gap: var(--space-5); padding-left: var(--space-3); }
.play { gap: var(--space-3); padding: 0 var(--pad-inline) 0 var(--space-5); background: var(--button-primary-bg) !important; border-color: var(--button-primary-bg) !important; color: var(--button-primary-text) !important; font-weight: var(--weight-strong); }
.play svg.i { fill: currentColor; stroke: none; }
.play:disabled { background: var(--surface-panel) !important; border-color: var(--border) !important; color: var(--text-disabled) !important; }
.timecode { font: var(--weight-strong) var(--text-xl)/1 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; min-width: 9.2ch; }
.timecode .ms { color: var(--text-secondary); font-weight: var(--weight-medium); }
.modes { display: flex; gap: var(--space-3); align-items: center; min-width: 0; }
.ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-active) 0); -webkit-mask: radial-gradient(circle 5px, transparent 98%, #000 100%); mask: radial-gradient(circle 5px, transparent 98%, #000 100%); }
.cmd-button { color: var(--text-secondary); gap: var(--space-4); }
.toolgroup { display: flex; gap: var(--space-1); }

/* ===== headers =========================================================== */
.heads { grid-area: heads; display: flex; flex-direction: column; }
.heads-top { height: calc(var(--overview-h) + var(--ruler-h)); flex: none; display: flex; align-items: flex-end; padding: 0 var(--pad-inline) var(--space-2); border-bottom: 1px solid var(--border); font-size: var(--text-xs); color: var(--text-secondary); }
.heads-scroll { flex: 1; overflow: hidden; }
.track-header {
  position: relative; display: grid; grid-template-rows: var(--control-h-sm) var(--control-h-sm); align-content: start; row-gap: var(--space-3);
  padding: var(--space-3) var(--space-4) 0 calc(var(--spine-w) + var(--pad-inline)); border-bottom: 1px solid var(--border-subtle); overflow: hidden;
}
.track-header::before { content: ""; position: absolute; left: calc(var(--spine-w) + var(--space-1)); top: calc(var(--space-3) + var(--control-h-sm) / 2); width: 3px; height: 20px; transform: translateY(-50%); border-radius: 2px; background: var(--track-colour, transparent); }
.track-header[data-bus]::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--spine-w); background: var(--bus-spine); }
.track-header.group-end::after { bottom: var(--space-4); border-radius: 0 0 var(--spine-w) var(--spine-w); }
.track-header[data-bus]:not(.bus-header, .merged) { padding-left: calc(var(--spine-w) + var(--pad-inline) + var(--indent-member)); }
.track-header[data-bus]:not(.bus-header, .merged)::before { left: calc(var(--spine-w) + var(--space-1) + var(--indent-member)); }
.track-header.current { background: var(--header-bg-current); }
.track-header.compact { grid-template-rows: var(--control-h-sm); align-content: center; padding-top: 0; }
.track-header.compact .th-controls { display: none; }
.track-header.compact::before { top: 50%; }
.track-header.strip { grid-template-rows: 1fr; padding-top: 0; align-content: center; }
.track-header.strip .th-controls, .track-header.strip .ms, .track-header.strip .role, .track-header.strip .bus-pick { display: none; }
.track-header.strip .track-name { font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--text-secondary); }
.track-header.strip::before { display: none; }
.track-header.unheard .track-name, .track-header.unheard .th-controls { opacity: 0.55; }
/* Progressive disclosure: at rest role, name, M, S. Compact shows all. */
:root:not([data-density="compact"]) .track-header:not(.current, :hover, :focus-within) .th-controls { visibility: hidden; }
:root:not([data-density="compact"]) .track-header:not(.current, :hover, :focus-within) .bus-pick { display: none; }
.bus-header:not(:hover, :focus-within) .ms-button.solo { display: none; }
:root[data-density="compact"] .track-header:not(.bus-header) { align-content: center; padding-top: 0; row-gap: var(--space-2); }
:root[data-density="compact"] .track-header::before { top: 30%; }
.th-top, .th-controls { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.track-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font-weight: var(--weight-strong); border: 0; background: none; padding: 0; text-align: left; }
.role { display: grid; place-items: center; width: 16px; flex: none; color: var(--text-secondary); }
.role svg.i { width: 15px; height: 15px; }
.ms { display: inline-flex; gap: var(--space-1); flex: none; }
.ms-button { width: var(--control-h-sm); height: var(--control-h-sm); padding: 0; display: grid; place-items: center; font: var(--weight-strong) var(--text-xs)/1 var(--font-ui); color: var(--text-secondary); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-xs); cursor: pointer; }
.ms-button:hover { border-color: var(--border-strong); color: var(--text); }
.ms-button.mute[aria-pressed="true"] { background: var(--mute-on-bg); border-color: var(--mute-on-bg); color: var(--surface-panel); }
.ms-button.solo[aria-pressed="true"] { background: var(--solo-on-bg); border-color: var(--solo-on-bg); color: var(--surface-panel); }
.ms-button.implicit { border-style: dashed; }
.bus-pick { flex: none; height: var(--control-h-sm); display: inline-flex; align-items: center; gap: 1px; padding: 0 2px 0 var(--space-2); font: var(--weight-strong) var(--text-xs) / 1 var(--font-ui); color: var(--bus-text, var(--text-secondary)); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-xs); cursor: pointer; }
.bus-pick svg.i { width: 12px; height: 12px; }
.slider-control { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-size: var(--text-xs); color: var(--text-secondary); }
.slider-control.gain { flex: 1; }
.slider-control.pan { width: 84px; flex: none; }
.slider-control output { min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.slider-control.pan output { min-width: 28px; }
input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 16px; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--border-strong); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%; background: var(--text); border: 2px solid var(--surface-panel); box-shadow: 0 0 0 1px var(--border-strong); }
.slider-control.has-ab input[type="range"] { background: linear-gradient(var(--accent), var(--accent)) no-repeat var(--ab-at, 50%) 50% / 2px 12px; }
/* Bus header: ONE short line, flush with the spine; a bus-coloured fader on hover. */
.bus-header { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4) 0 calc(var(--spine-w) + var(--space-3)); background: var(--bus-band); }
.bus-header .bus-levels { display: none; align-items: center; gap: var(--space-2); min-width: 0; flex: 0 1 150px; }
.bus-header:is(:hover, :focus-within) .bus-levels { display: flex; }
.bus-header:is(:hover, :focus-within) .bus-name { flex: 0 1 auto; }
.bus-levels .fader-label { font-size: var(--text-xs); font-weight: var(--weight-strong); color: var(--bus-text); }
.bus-levels input[type="range"]::-webkit-slider-runnable-track { height: 5px; background: var(--bus-spine); }
.bus-levels input[type="range"]::-webkit-slider-thumb { margin-top: -3.5px; box-shadow: 0 0 0 1.5px var(--bus-spine); }
.bus-header.collapsed-row { align-items: center; }
.bus-badge { flex: none; min-width: 18px; height: 18px; padding: 0 var(--space-1); display: inline-grid; place-items: center; font: var(--weight-strong) var(--text-xs) / 1 var(--font-ui); font-style: normal; color: var(--bus-text, var(--text-secondary)); border: 1.5px solid var(--bus-spine, var(--border-strong)); border-radius: var(--radius-xs); background: transparent; cursor: pointer; padding-block: 0; }
.bus-badge.mini { min-width: 15px; height: 15px; font-size: 10px; margin-left: var(--space-2); vertical-align: 1px; cursor: default; }
.bus-name { flex: 1; min-width: 0; font-weight: var(--weight-strong); color: var(--bus-text, var(--text)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bus-header.no-members .bus-name { color: var(--text-tertiary); font-style: italic; font-weight: var(--weight-medium); }
.bus-count { font-size: var(--text-xs); color: var(--text-secondary); }
.disclose { width: 20px; height: 20px; padding: 0; display: grid; place-items: center; background: none; border: 0; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-xs); }
.disclose:hover { background: var(--surface-hover); }
.disclose svg.i { width: 14px; height: 14px; transition: transform var(--dur-base) var(--ease-standard); }
.disclose[aria-expanded="false"] svg.i { transform: rotate(-90deg); }
/* A one-track bus merged into its track's header: badge before the name, spine kept. */
.track-header.merged .th-top .bus-badge { margin-right: var(--space-1); }
.group-gap { background: var(--panel-bg); }

/* ===== timeline ========================================================== */
.tl-column { grid-area: timeline; display: grid; grid-template-rows: auto var(--overview-h) minmax(0, 1fr); position: relative; background: var(--lane-bg); }
.tl-column canvas { display: block; width: 100%; height: 100%; }
#overview { border-bottom: 1px solid var(--border-subtle); background: var(--surface-panel); cursor: pointer; }
.tl-stack { position: relative; min-height: 0; }
.tl-stack canvas { position: absolute; inset: 0; }
#timeline:focus-visible { outline-offset: -2px; }
.tl-column[data-focused]::before, .dock[data-focused]::before, .sidebar[data-focused]::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); z-index: 3; }
.empty-state { position: absolute; inset: var(--ruler-h) 0 0 0; display: grid; place-items: center; padding: var(--space-6); }
.drop-card { width: min(480px, 100%); padding: var(--space-8) var(--space-7); text-align: center; border-radius: var(--radius-lg); border: 1.5px dashed var(--border-strong); background: var(--surface-panel); display: grid; gap: var(--row-gap); justify-items: center; }
.drop-card h2 { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-strong); }
.drop-card p { margin: 0; color: var(--text-secondary); }
.drop-card .row { display: flex; gap: var(--space-4); flex-wrap: wrap; justify-content: center; margin-top: var(--space-2); }
.drop-card .formats { font-size: var(--text-xs); color: var(--text-tertiary); }
.drop-card svg.big { width: 40px; height: 40px; color: var(--accent-text); stroke-width: 1.3; }
/* Compare bar: docked at the top of the timeline, never a modal. */
.compare-bar { display: grid; gap: var(--space-2); padding: var(--space-3) var(--pad-inline); background: var(--surface-panel); border-bottom: 2px dashed var(--signal-preview); font-size: var(--text-sm); white-space: nowrap; }
.cmp-row { display: flex; align-items: center; gap: var(--space-3); min-width: 0; overflow: hidden; }
.cmp-row.meta { font-size: var(--text-xs); color: var(--text-secondary); }
.compare-bar .what { font-weight: var(--weight-strong); }
.slots { display: flex; gap: var(--space-2); }
.slot { display: inline-flex; align-items: center; gap: var(--space-3); height: var(--control-h); padding: 0 var(--space-5); border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: transparent; cursor: pointer; }
.slot b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--radius-xs); border: 1.5px solid currentColor; font-size: var(--text-xs); }
.slot[aria-pressed="true"] { background: var(--signal-preview); border-color: var(--signal-preview); color: var(--text-on-accent); }
.slot .render { font-size: var(--text-xs); color: var(--text-secondary); }
.slot .bar { width: 46px; height: 4px; border-radius: 2px; background: var(--surface-active); overflow: hidden; }
.slot .bar i { display: block; height: 100%; background: var(--accent); }
.match { color: var(--text-secondary); }

/* ===== panels ============================================================ */
.panel-head { height: calc(var(--control-h) + var(--space-4)); flex: none; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-4) 0 var(--pad-panel); border-bottom: 1px solid var(--panel-divider); }
.panel-head h2 { margin: 0; font-size: var(--text-sm); font-weight: var(--weight-strong); white-space: nowrap; }
.panel-head .meta { font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint { color: var(--text-secondary); font-size: var(--text-sm); }
.empty-panel { padding: var(--space-7) var(--pad-panel); color: var(--text-secondary); display: grid; gap: var(--row-gap); justify-items: start; max-width: 46ch; }
.empty-panel strong { color: var(--text); font-weight: var(--weight-strong); }

/* transcript */
.dock { grid-area: dock; display: flex; flex-direction: column; position: relative; }
.transcript { flex: 1; overflow: auto; padding: var(--pad-panel) var(--pad-panel) var(--space-8); }
.para { display: grid; grid-template-columns: 140px minmax(0, var(--reading-max)); gap: var(--space-7); margin-bottom: calc(var(--row-gap) * 1.6); }
.para.dim .text { color: var(--text-tertiary); }
.speaker { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; border-left: 3px solid var(--track-colour); padding-left: var(--space-4); min-width: 0; }
.speaker b { font-size: var(--text-sm); font-weight: var(--weight-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.speaker span { font-size: var(--text-xs); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.text { font-size: var(--text-lg); line-height: var(--leading-read); margin: 0; }
.w { border-radius: 2px; padding: 1px 0; cursor: text; }
.w:hover { background: var(--surface-hover); }
.w.now { box-shadow: inset 0 -2px 0 var(--accent); }
.w.sel { background: var(--accent-subtle); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.w.cut { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--text-tertiary); }
.w.cand { background: var(--signal-candidate-fill); text-decoration: underline wavy var(--signal-candidate); text-decoration-thickness: 1px; text-underline-offset: 4px; }
.w.also { color: var(--signal-collateral); text-decoration: line-through wavy var(--signal-collateral); text-decoration-thickness: 1.5px; background: var(--signal-collateral-fill); animation: breathe calc(var(--dur-flash) * 3) var(--ease-standard) infinite alternate; }
.w.also::after { content: "×"; font-size: 0.7em; vertical-align: super; margin-left: 1px; }
:root[data-motion="off"] .w.also, :root[data-motion="subtle"] .w.also { animation: none; }
@keyframes breathe { from { background: transparent; } }
.w.low { text-decoration: underline dotted var(--text-tertiary); text-underline-offset: 4px; }
.placeholder { font-style: italic; color: var(--text-secondary); border: 1px dashed var(--signal-placeholder); border-radius: var(--radius-sm); padding: 1px var(--space-3); }
.placeholder small { font-style: normal; font-size: var(--text-xs); color: var(--text-tertiary); margin-left: var(--space-3); }
.word-pop { position: absolute; z-index: 5; display: grid; gap: var(--space-3); padding: var(--space-4); max-width: 560px; background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); font-size: var(--text-sm); }
.word-pop .sum { display: flex; gap: var(--space-3); align-items: center; color: var(--signal-collateral); font-weight: var(--weight-medium); }
.word-pop .sum.none { color: var(--text-secondary); }
.word-pop .acts { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.rec-head { display: flex; gap: var(--space-3); align-items: center; font-size: var(--text-xs); color: var(--text-secondary); margin: var(--space-2) 0 var(--space-3); }

/* sidebar */
.sidebar { grid-area: side; display: flex; flex-direction: column; position: relative; container: sidebar / inline-size; }
.tabs { height: calc(var(--control-h) + var(--space-5)); flex: none; display: flex; gap: var(--space-1); padding: 0 var(--space-3); border-bottom: 1px solid var(--border); align-items: stretch; }
.tab { display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-secondary); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { font-size: var(--text-xs); min-width: 18px; height: 18px; border-radius: var(--radius-pill); background: var(--surface-active); color: var(--text); padding: 0 5px; display: inline-grid; place-items: center; }
@container sidebar (width < 420px) { .tab:not([aria-selected="true"]) .label { display: none; } }
.side-body { flex: 1; overflow: auto; }
details.section { border-bottom: 1px solid var(--panel-divider); }
details.section > summary { display: flex; align-items: center; gap: var(--space-3); min-height: calc(var(--control-h) + var(--space-4)); padding: 0 var(--pad-panel); list-style: none; cursor: pointer; font-size: var(--text-sm); font-weight: var(--weight-strong); color: var(--text-secondary); }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform var(--dur-base) var(--ease-standard); }
details.section[open] > summary::before { transform: rotate(45deg); }
details.section > summary:hover { color: var(--text); }
details.section > summary .peek { margin-left: auto; font-weight: var(--weight-regular); color: var(--text-tertiary); font-size: var(--text-xs); }
.section-body { padding: 0 var(--pad-panel) var(--pad-panel); display: grid; gap: var(--row-gap); }
.clip-title { display: flex; gap: var(--space-4); align-items: flex-start; padding: var(--pad-panel); border-bottom: 1px solid var(--panel-divider); }
.clip-title .sw { width: 4px; align-self: stretch; border-radius: 2px; background: var(--track-colour); }
.clip-title b { display: block; font-size: var(--text-lg); font-weight: var(--weight-strong); line-height: var(--leading-tight); overflow-wrap: anywhere; }
.clip-title span { font-size: var(--text-xs); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.field { display: grid; grid-template-columns: minmax(80px, 40%) minmax(0, 1fr) auto; gap: var(--space-4); align-items: center; min-height: var(--control-h); }
.field > label, .field > .label { color: var(--text-secondary); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field .val { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.input { height: var(--control-h); padding: 0 var(--space-3); width: 84px; text-align: right; font-variant-numeric: tabular-nums; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-sm); }
.input.has-ab { border-color: var(--accent); }
.input.invalid { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.field-error { grid-column: 1 / -1; color: var(--danger-text); font-size: var(--text-xs); display: flex; gap: var(--space-2); align-items: center; }
.select { height: var(--control-h); padding: 0 var(--space-3); background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-sm); min-width: 0; max-width: 100%; }
.status-line { display: flex; gap: var(--space-3); align-items: flex-start; font-size: var(--text-sm); }
.status-line svg.i { margin-top: 2px; }
.status-line.ok { color: var(--ok-text); }
.status-line.danger { color: var(--danger-text); }
.button-row { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-5); font-size: var(--text-sm); margin: 0; }
.facts dt { color: var(--text-secondary); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bus-line { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); color: var(--bus-text); }
.file-chip { font: var(--weight-strong) 10px / 14px var(--font-mono); padding: 0 var(--space-2); border: 1px solid var(--border-strong); border-radius: var(--radius-xs); background: var(--signal-file-mark); color: var(--signal-file-mark-text); }
.minimap { display: block; width: 100%; height: 28px; border-radius: var(--radius-xs); }
.legend { display: flex; gap: var(--space-5); font-size: var(--text-xs); color: var(--text-secondary); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.siblist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
.siblist button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: var(--space-4); align-items: center; text-align: left; padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; font-size: var(--text-sm); }
.siblist button:hover { background: var(--surface-hover); }
.siblist .part { color: var(--signal-sibling); font-weight: var(--weight-strong); font-variant-numeric: tabular-nums; }
.siblist .where { color: var(--text-secondary); font-variant-numeric: tabular-nums; font-size: var(--text-xs); }
.siblist .this { background: var(--accent-subtle); }
/* history, candidates, bin */
.hist { list-style: none; margin: 0; padding: var(--space-3) 0; }
.hist li { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--pad-panel); font-size: var(--text-sm); }
.hist li:hover { background: var(--surface-hover); }
.hist li .t { color: var(--text-secondary); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.hist li .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist li svg.i { width: 14px; height: 14px; color: var(--text-secondary); }
.hist li.head { background: var(--accent-subtle); box-shadow: inset 3px 0 0 var(--accent); font-weight: var(--weight-strong); }
.hist li.future .lab, .hist li.future svg.i { color: var(--text-tertiary); }
.hist li.branch { padding-left: calc(var(--pad-panel) + 18px); }
.hist li.branch::before { content: ""; position: absolute; left: calc(var(--pad-panel) + 8px); top: 0; bottom: 50%; width: 8px; border-left: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); border-bottom-left-radius: 4px; }
.hist li.branch .lab { color: var(--text-tertiary); }
.hist li.pin .lab { font-weight: var(--weight-strong); }
.hist li.pin svg.i { color: var(--accent-text); }
.hist li.preview { box-shadow: inset 0 0 0 1px var(--border-strong); }
.hist li.marker { display: flex; gap: var(--space-4); padding: var(--space-5) var(--pad-panel) var(--space-2); color: var(--text-secondary); font-size: var(--text-xs); font-weight: var(--weight-medium); }
.hist li.marker::after { content: ""; flex: 1; border-top: 1px solid var(--border); align-self: center; }
.actionbar { flex: none; display: flex; gap: var(--space-3); align-items: center; padding: var(--space-5) var(--pad-panel); border-top: 1px solid var(--border); background: var(--surface-panel); flex-wrap: wrap; }
.actionbar .hint { flex: 1 1 100%; font-size: var(--text-xs); }
.cand-summary { display: flex; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-5) var(--pad-panel); border-bottom: 1px solid var(--panel-divider); }
.cands { list-style: none; margin: 0; padding: 0; }
.cands li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: var(--space-1) var(--space-4); padding: var(--space-5) var(--pad-panel); border-bottom: 1px solid var(--panel-divider); font-size: var(--text-sm); }
.cands li.current { background: var(--accent-subtle); box-shadow: inset 3px 0 0 var(--accent); }
.cands .when { font-variant-numeric: tabular-nums; font-weight: var(--weight-strong); }
.cands .dur { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.cands .quote { grid-column: 2 / 4; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cands li.done .when, .cands li.done .quote { color: var(--text-tertiary); }
.state { font-size: var(--text-xs); font-weight: var(--weight-medium); padding: 1px var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
.state.open { border-color: var(--signal-candidate); color: var(--danger-text); }
.state.cut { text-decoration: line-through; }
.preview-bar { display: grid; grid-template-columns: 2fr 2.4fr 2fr; height: 28px; border-radius: var(--radius-sm); overflow: hidden; font-size: var(--text-xs); }
.preview-bar span { display: grid; place-items: center; background: var(--surface-active); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.preview-bar span.skip { background: repeating-linear-gradient(135deg, var(--signal-candidate-fill) 0 6px, transparent 6px 12px); color: var(--danger-text); border-inline: 1px solid var(--signal-candidate); }
.bin-rec { border-bottom: 1px solid var(--panel-divider); padding: var(--space-4) var(--pad-panel) var(--space-5); }
.bin-rec h4 { margin: 0 0 var(--space-3); display: flex; gap: var(--space-3); align-items: center; font-size: var(--text-sm); }
.bin-rec h4 .meta { margin-left: auto; font-weight: var(--weight-regular); color: var(--text-secondary); font-size: var(--text-xs); }

/* ===== status bar, menus, toasts, palette ================================= */
.statusbar { grid-area: status; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--pad-inline); font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; overflow: hidden; }
.statusbar .button { height: calc(var(--statusbar-h) - 8px); padding: 0 var(--space-4); font-size: var(--text-xs); color: var(--text-secondary); border-color: transparent; background: transparent; }
.statusbar .button:hover { background: var(--surface-hover); color: var(--text); }
.statusbar .icon-button { width: calc(var(--statusbar-h) - 8px); padding: 0; }
.statusbar .div { width: 1px; height: 14px; background: var(--border); flex: none; }
.statusbar .zoom { color: var(--text); font-weight: var(--weight-medium); min-width: 7ch; text-align: center; font-variant-numeric: tabular-nums; }
.keyhints { display: flex; gap: var(--space-6); overflow: hidden; min-width: 0; }
.keyhints span { display: inline-flex; gap: var(--space-2); align-items: center; }
.saved { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--ok-text); }
.saved svg.i { width: 13px; height: 13px; }
.menu { position: fixed; z-index: 25; width: 300px; padding: var(--space-4); display: grid; gap: var(--space-3); background: var(--toast-bg); border-radius: var(--radius-md); box-shadow: var(--toast-shadow); font-size: var(--text-sm); }
.menu .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); color: var(--text-secondary); }
.toast { position: fixed; left: 50%; bottom: calc(var(--statusbar-h) + var(--space-6)); transform: translateX(-50%); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); max-width: min(600px, calc(100vw - 32px)); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-6); background: var(--toast-bg); border-radius: var(--radius-md); box-shadow: var(--toast-shadow); animation: toast-in var(--dur-base) var(--ease-standard); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } }
.toast::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.toast.error::before { background: var(--danger); }
.toast .msg { flex: 1 1 240px; min-width: 0; }
.toast .acts { display: flex; gap: var(--space-2); flex: none; margin-left: auto; }
.toast svg.lead { color: var(--danger-text); }
/* Import panel: a toast-like panel, never a modal. */
.import-panel { position: fixed; left: calc(var(--heads-w) + var(--space-6)); bottom: calc(var(--statusbar-h) + var(--space-6)); z-index: 20; width: min(560px, 60vw); padding: var(--space-5) var(--pad-panel); background: var(--toast-bg); border-radius: var(--radius-md); box-shadow: var(--toast-shadow); display: grid; gap: var(--row-gap); font-size: var(--text-sm); }
.import-panel h3 { margin: 0; font-size: var(--text-md); display: flex; gap: var(--space-3); align-items: center; }
.import-panel .opts { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.import-panel ul { margin: 0; padding-left: var(--space-6); color: var(--danger-text); }
/* The command palette, docked over the sidebar column: never over the lanes. */
.palette { position: fixed; z-index: 30; top: calc(var(--topbar-h) + 1px); right: 0; width: var(--sidebar-w); max-height: calc(100vh - var(--topbar-h) - var(--statusbar-h) - 2px); background: var(--surface-raised); border-left: 1px solid var(--border); box-shadow: var(--shadow-raised); overflow: hidden; display: flex; flex-direction: column; animation: toast-in var(--dur-base) var(--ease-standard); }
@container app (max-width: 1399px) { .palette { width: var(--sidebar-w-min); } }
.palette .search { display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--pad-inline); height: calc(var(--control-h) + var(--space-6)); border-bottom: 1px solid var(--border); }
.palette .search input { flex: 1; min-width: 0; border: 0; background: none; font-size: var(--text-lg); outline: none; }
.palette ul { list-style: none; margin: 0; padding: var(--space-3) 0; overflow: auto; }
.palette .grp { padding: var(--space-4) var(--pad-inline) var(--space-2); font-size: var(--text-xs); font-weight: var(--weight-strong); color: var(--text-secondary); }
.palette li.cmd { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--pad-inline); min-height: var(--control-h); cursor: pointer; }
.palette li.cmd .def { grid-column: 2 / 3; font-size: var(--text-xs); color: var(--text-secondary); }
.palette li.cmd.active { background: var(--accent-subtle); }
.palette li.cmd .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette li.cmd .lab mark { background: none; color: inherit; font-weight: var(--weight-strong); text-decoration: underline; text-underline-offset: 3px; }
.palette li.cmd .keys { grid-row: 1; grid-column: 3; display: flex; gap: 2px; }
.palette .ask { margin: 0 var(--pad-inline) var(--space-4); padding: var(--space-4); border-radius: var(--radius-sm); background: var(--surface-sunken); display: grid; gap: var(--space-3); font-size: var(--text-sm); }
.palette .foot { display: flex; gap: var(--space-5); padding: var(--space-3) var(--pad-inline); border-top: 1px solid var(--border); font-size: var(--text-xs); color: var(--text-secondary); flex-wrap: wrap; }
.popover { position: fixed; z-index: 25; width: 320px; background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); padding: var(--space-3) 0; font-size: var(--text-sm); }
.popover .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); padding: var(--space-3) var(--pad-panel); align-items: center; }
.popover .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-active); overflow: hidden; }
.popover .bar i { display: block; height: 100%; background: var(--accent); }
.popover .row.failed .bar i { background: var(--danger); }
.popover .sub { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--text-secondary); }
.popover .row.failed .sub { color: var(--danger-text); }

/* ===== gallery ============================================================ */
body.gallery-mode .frame { overflow: auto; }
body.gallery-mode .app { display: block; height: auto; background: var(--surface-app); }
.gallery { max-width: 1400px; margin: 0 auto; padding: var(--space-7) var(--space-6) var(--space-8); color: var(--text); }
.gallery h1 { margin: 0 0 var(--space-2); font-size: var(--text-xl); }
.gallery h2 { margin: var(--space-8) 0 var(--space-4); font-size: var(--text-lg); }
.gallery header p { margin: 0; color: var(--text-secondary); max-width: 90ch; }
.gallery code { font-family: var(--font-mono); font-size: var(--text-sm); }
.g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: var(--space-5); }
.g-wide { display: grid; grid-template-columns: repeat(auto-fill, minmax(620px, 1fr)); gap: var(--space-5); }
.g-card { margin: 0; background: var(--surface-panel); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; }
.g-card canvas { display: block; width: 100%; border-bottom: 1px solid var(--border-subtle); }
.g-card figcaption { padding: var(--space-4) var(--space-5) var(--space-5); font-size: var(--text-sm); }
.g-card figcaption b { display: block; margin-bottom: var(--space-3); }
.g-card dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px var(--space-4); margin: 0; }
.g-card dt { color: var(--text-secondary); }
.g-card dd { margin: 0; }
.g-card.split { display: grid; grid-template-columns: 300px 1fr; }
.g-card.split .g-heads { border-right: 1px solid var(--border-subtle); background: var(--surface-panel); }

/* Help (WP48) */
.side-body .help-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--pad-panel); background: var(--surface-panel); border-bottom: 1px solid var(--border-subtle); }
.help-head h2 { display: flex; align-items: center; gap: var(--space-2); margin: 0; font-size: var(--text-lg); }
.help-head h2 .i { color: var(--accent); }
.help-head .spacer, .help-foot .spacer { flex: 1; }
.help-search { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-3) var(--pad-panel) 0; padding: 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--text-secondary); }
.help-search input { flex: 1; border: 0; background: transparent; box-shadow: none; padding-inline: 0; }
.help-why { margin: var(--space-3) var(--pad-panel) 0; font-size: var(--text-xs); color: var(--text-secondary); }
.help-body { padding: var(--space-2) var(--pad-panel) var(--space-5); line-height: var(--leading-read); max-width: var(--reading-max); }
.help-body h3 { margin: var(--space-5) 0 var(--space-2); font-size: var(--text-sm); color: var(--text-secondary); font-weight: var(--weight-strong); }
.help-body p, .help-body ul { margin: 0 0 var(--space-3); }
.help-body ul { padding-left: var(--space-5); }
.help-body li { margin-bottom: var(--space-1); }
.help-body kbd, .tip kbd, .coach kbd, .help-search kbd { font: var(--weight-strong) var(--text-xs)/1.6 var(--font-ui); padding: 0 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: var(--radius-xs); background: var(--surface-panel); white-space: nowrap; }
.help-nokey { font-size: var(--text-xs); color: var(--text-tertiary); font-style: italic; }
.help-link { color: var(--accent); font-weight: var(--weight-strong); }
.help-show { margin-left: var(--space-1); }
.help-results { list-style: none; padding: 0 !important; }
.help-results li { display: grid; gap: 2px; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-subtle); }
.help-results .hint { font-size: var(--text-xs); color: var(--text-secondary); }
.help-command { grid-template-columns: auto 1fr; align-items: center; }
.help-command .hint { grid-column: 1 / -1; }
.side-body:has(> .help-tab) { display: flex; flex-direction: column; }
.help-tab { flex: 1 0 auto; display: flex; flex-direction: column; }
.help-search .input { text-align: left; }
.help-foot { margin-top: auto; position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--pad-panel); border-top: 1px solid var(--border-subtle); background: var(--surface-panel); font-size: var(--text-sm); color: var(--text-secondary); }
.help-highlight { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: var(--radius-xs); }
.tip { position: fixed; z-index: 30; max-width: 300px; padding: var(--space-3); font-size: var(--text-sm); background: var(--surface-raised); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgb(0 0 0 / 0.18); }
.tip span { color: var(--text-secondary); }
.tip .tip-more { display: block; margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--border-subtle); font-size: var(--text-xs); }
/* Onboarding sketch */
.onboarding .g-wide { margin-top: var(--space-6); }
.onboarding .ob-stage { padding: var(--space-5); background: var(--surface-app); min-height: 260px; display: grid; place-items: center; }
.onboarding .ob-note { margin: 0; padding: var(--space-4) var(--space-5); font-size: var(--text-sm); color: var(--text-secondary); }
.onboarding .ob-note.wide { max-width: 90ch; padding: 0; }
.welcome { width: 100%; max-width: 440px; display: grid; gap: var(--space-3); justify-items: start; padding: var(--space-6); background: var(--surface-panel); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 8px 28px rgb(0 0 0 / 0.16); }
.welcome h2 { margin: 0; font-size: var(--text-xl); }
.welcome p { margin: 0; color: var(--text-secondary); }
.welcome .big { height: var(--control-h-lg); font-size: var(--text-md); }
.welcome .row, .coach .row, .tipcard .row { display: flex; gap: var(--space-2); align-items: center; width: 100%; }
.welcome .hint { font-size: var(--text-sm); color: var(--text-secondary); }
.tour-mock { position: relative; width: 100%; display: grid; gap: var(--space-4); }
.tour-words { margin: 0; padding: var(--space-4); background: var(--surface-panel); border-radius: var(--radius-sm); line-height: var(--leading-read); }
.tour-words mark { background: var(--selection-range); color: inherit; outline: 2px solid var(--accent); border-radius: 2px; }
.coach { position: relative; max-width: 380px; justify-self: center; padding: var(--space-4); background: var(--surface-raised); border: 2px solid var(--accent); border-radius: var(--radius-md); box-shadow: 0 6px 22px rgb(0 0 0 / 0.2); }
.coach::before { content: ""; position: absolute; top: -9px; left: 44%; width: 14px; height: 14px; background: var(--surface-raised); border-left: 2px solid var(--accent); border-top: 2px solid var(--accent); transform: rotate(45deg); }
.coach p { margin: var(--space-2) 0 var(--space-3); }
.coach .dots { display: flex; gap: 6px; margin-top: var(--space-3); }
.coach .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }

.tipcard { justify-self: center; max-width: 340px; padding: var(--space-4); background: var(--surface-raised); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); }
.tipcard p { margin: var(--space-2) 0 var(--space-3); font-size: var(--text-sm); }

<script>
"use strict";
// -- grammar.js (copy) --
// The visual grammar: every signal kuulas draws on a clip, a lane or a
// group, in one place. Each signal uses ONE channel, and each channel
// carries ONE meaning, so a glance reads the same way everywhere:
//
//   hue, tone   identity: who speaks (track hue), which file (tone step)
//   opacity     audibility: muted, not heard because of solo, unused
//   weight      selection: the 2 px neutral outline
//   dash        reality: dashed = not real audio yet (placeholder, pending)
//   scope       edit scope: what the next time-shifting edit takes along
//   pattern     absent or maybe absent: muted hatch, cut candidate, damaged, removed
//   strip       role: speech, music (top edge; off on the timeline)
//   badge       facts: sync group, drift, free, file mark, takes, label
//   cap         level: clipping
//   seam        joins: clean split (hairline) or jump cut (notch)
//   bar         change since a checkpoint (WP31): added
//   spine, band grouping: the bus a track belongs to
//   line        attachment: connected clip tether (WP19b)
//   notch       annotation: a note or marker on the clip
//   bracket     relation: corner brackets on clips of the same recording
//   ribbon      activity: who sounds when, inside a collapsed bus
//
// Colours are never written here: each signal names its semantic tokens
// (tokens.css), and resolvePalette reads them once per theme change for the
// canvases. CSS uses the same token names. Spec: docs/design/GUI-DESIGN.md,
// "The visual grammar"; tests: ui/tests/grammar.test.js.

const CHANNELS = [
  "hue",
  "tone",
  "opacity",
  "weight",
  "dash",
  "scope",
  "pattern",
  "strip",
  "badge",
  "cap",
  "seam",
  "bar",
  "spine",
  "band",
  "line",
  "notch",
  "bracket",
  "ribbon",
];

const SPEAKER_HUE_COUNT = 6;
/** Eight bus hues (nested buses need more than four); the letter is the twin. */
const BUS_HUES = 8;
const LABEL_COLOURS = 6;
const TRACK_HUE_NAMES = [
  ...Array.from({ length: SPEAKER_HUE_COUNT }, (_, i) => String(i)),
  "music",
];
const TRACK_PARTS = ["wave", "body", "body-alt", "edge", "label"];
const BUS_PARTS = ["spine", "band", "text"];

const trackTokens = (part) => TRACK_HUE_NAMES.map((n) => `--track-${n}-${part}`);
const busTokens = () =>
  Array.from({ length: BUS_HUES }, (_, i) => BUS_PARTS.map((p) => `--bus-${i + 1}-${p}`)).flat();

/**
 * Every signal. `priority`: lower is more important. `always`: never dropped
 * by pickSignals (identity, selection, alarms); the rest compete for at most
 * three places on a clip. `twin`: how the signal reads without colour.
 * `status`: "built" in the editor today, "prototype" (designed and shown in
 * the prototype, built with its work package), "planned".
 */
const SIGNALS = [
  {
    id: "speaker",
    channel: "hue",
    meaning: "identity",
    priority: 0,
    atRest: true,
    always: true,
    tokens: [
      ...trackTokens("wave"),
      ...trackTokens("body"),
      ...trackTokens("edge"),
      ...trackTokens("label"),
    ],
    twin: "track name in the header and file name on the clip; the header swatch is a short pill",
    when: "always",
    key: "",
    status: "built",
  },
  {
    id: "file-zebra",
    channel: "tone",
    meaning: "identity",
    priority: 0,
    atRest: true,
    always: true,
    tokens: trackTokens("body-alt"),
    twin: "file mark chip and file name on each clip; a seam marks every change of file",
    when: "neighbouring clips on one track come from different files",
    key: "",
    status: "built",
  },
  {
    id: "selected",
    channel: "weight",
    meaning: "selection",
    priority: 0,
    atRest: true,
    always: true,
    tokens: ["--signal-selected"],
    twin: "2 px outline (shape), plus the inspector shows the clip",
    when: "the clip is selected",
    key: "click, Tab, Mod+A",
    status: "built",
  },
  {
    id: "muted",
    channel: "opacity",
    meaning: "audibility",
    priority: 1,
    atRest: true,
    always: true,
    tokens: ["--signal-muted-hatch", "--signal-muted-opacity"],
    twin: "diagonal hatch over the clip; M pressed in the header for a muted track",
    when: "the clip is muted",
    key: "N",
    status: "built",
  },
  {
    id: "unheard",
    channel: "opacity",
    meaning: "audibility",
    priority: 1,
    atRest: true,
    always: true,
    tokens: ["--signal-unheard-opacity"],
    twin: "header says 'not heard: solo' in its tooltip and the M button turns dashed",
    when: "another track is soloed, or this track is muted",
    key: "Shift+S, Shift+M",
    status: "prototype",
  },
  {
    id: "gate",
    channel: "opacity",
    meaning: "audibility",
    priority: 1,
    atRest: true,
    always: true,
    tokens: ["--signal-gate", "--signal-gate-opacity"],
    twin: "the waveform under the band is drawn flat (a 1 px floor line), with a small gate tick at each edge; hover says 'Mic closed' and offers 'Open this stretch'",
    when: "Auto-Silence: one merged gate per track closes the mic (WP44); a per-lane toggle shows or hides it",
    key: "Alt+Mod+P runs Auto-Silence",
    status: "prototype",
  },
  {
    id: "unused",
    channel: "opacity",
    meaning: "audibility",
    priority: 6,
    atRest: false,
    whenNotAtRest: "only in the clip bin and on cards",
    always: false,
    tokens: ["--signal-unused-opacity"],
    twin: "the clip bin lists it under 'not in the programme'",
    when: "clip bin and cards: material not used in the open edit",
    key: "",
    status: "planned",
  },
  {
    id: "placeholder",
    channel: "dash",
    meaning: "reality",
    priority: 0,
    atRest: true,
    always: true,
    tokens: ["--signal-placeholder"],
    twin: "dashed outline, no waveform, the script text in italics inside",
    when: "narration placeholder (WP43)",
    key: "T",
    status: "prototype",
  },
  {
    id: "provisional",
    channel: "dash",
    meaning: "reality",
    priority: 2,
    atRest: false,
    whenNotAtRest: "only after 150 ms without the engine's confirmation",
    always: true,
    tokens: ["--signal-provisional"],
    twin: "short dashes (2 on, 2 off) on the outline",
    when: "an edit is shown but the engine has not confirmed it after 150 ms",
    key: "",
    status: "prototype",
  },
  {
    id: "partner",
    channel: "scope",
    meaning: "edit scope",
    priority: 2,
    atRest: false,
    whenNotAtRest: "only while a clip is selected",
    always: true,
    tokens: ["--signal-partner"],
    twin: "dashed 1 px outline inset 2 px, neutral",
    when: "a clip is selected: its sync partners that a move takes along (WP19a)",
    key: "E toggles group editing",
    status: "prototype",
  },
  {

/** Tokens holding a number (opacity), not a colour. */
const NUMBER_TOKENS = SEMANTIC_TOKENS.filter((name) => name.endsWith("-opacity"));
/** Tokens holding a shadow list: themes may not override them from a manifest. */
const SHADOW_TOKENS = ["--shadow-raised", "--shadow-dialog"];

function signalTokens() {
  return [...new Set(SIGNALS.flatMap((s) => s.tokens))];
}

const SIGNAL_BY_ID = new Map(SIGNALS.map((s) => [s.id, s]));
const signal = (id) => SIGNAL_BY_ID.get(id);

/**
 * Which of a clip's active signals to draw. `always` signals are all kept;
 * the others compete for `max` places by priority (registry order breaks
 * ties). `hidden` is what did not fit: draw it as a "+2" badge, list it on hover.
 */
function pickSignals(active, max = 3) {
  const known = active.map((id) => SIGNAL_BY_ID.get(id)).filter(Boolean);
  const order = (a, b) => a.priority - b.priority || SIGNALS.indexOf(a) - SIGNALS.indexOf(b);
  const ranked = known.filter((s) => !s.always).sort(order);
  const shown = [...known.filter((s) => s.always).sort(order), ...ranked.slice(0, max)];
  return { shown: shown.map((s) => s.id), hidden: ranked.slice(max).map((s) => s.id) };
}

/**
 * What the join between two clips on one track is, or null when they do not
 * touch. "split": same file, continuous in the source (a plain split: a
 * hairline). "jump": same file, audio between them removed (a notch; where
 * the auto crossfade goes). "file": a different file starts.
 */
function seamKind(left, right) {
  if (left.start + left.length !== right.start) return null;
  if (left.media !== right.media) return "file";
  return left.offset + left.length === right.offset ? "split" : "jump";
}

/**
 * Body tone step (0 or 1) per clip id: the step flips whenever a clip comes
 * from a different file than the clip before it in time, so neighbours from
 * different files never share a tone. Clips of one file in a row keep theirs.
 */
function zebraSteps(clips) {
  const steps = new Map();
  let step = 0;
  let previous = null;
  for (const clip of [...clips].sort((a, b) => a.start - b.start)) {
    if (previous !== null && clip.media !== previous) step = 1 - step;
    steps.set(clip.id, step);
    previous = clip.media;
  }
  return steps;
}

// No 0/O, 1/I, 2/Z, 5/S, 8/B: a mark is read at 10 px.
const MARK_ALPHABET = "ACDEFHJKLMNPRTUVWXY34679";
/** Two stable characters naming a file, from its SHA-256 (hex). */
function fileMark(sha256) {
  if (!sha256 || sha256.length < 4) return "";
  const n = Number.parseInt(sha256.slice(0, 4), 16);
  const base = MARK_ALPHABET.length;
  return MARK_ALPHABET[Math.floor(n / base) % base] + MARK_ALPHABET[n % base];
}

/** File marks only where they tell files apart: a track with 2+ files. */
function needsFileMark(track) {
  return new Set((track?.clips ?? []).map((clip) => clip.media)).size > 1;
}

/**
 * A collapsed bus with several members shows activity ribbons, one strip per
 * member in its own hue, instead of a summed waveform that hides who talks
 * when (owner, 2026-10-18). Strips are 8 px up to six members, thinner beyond
 * (never under 3 px); the row is capped at 48 px. One member: null (keep the
 * summed waveform).
 */
function ribbonLayout(members) {
  if (members <= 1) return null;
  const strip = members <= 6 ? 8 : Math.max(3, Math.floor(40 / members));
  return { strip, height: Math.min(48, members * strip + 8) };
}

/** Bus hue number (1..BUS_HUES) per bus id, by bus order. */
function busHues(project) {
  const hues = new Map();
  (project?.buses ?? []).forEach((bus, i) => {
    hues.set(bus.id, (i % BUS_HUES) + 1);
  });
  return hues;
}

/** The bus badge: A, B, … Z, AA, AB … (the non-colour twin of the bus hue). */
function busLetter(index) {
  let n = index;
  let out = "";
  do {
    out = String.fromCharCode(65 + (n % 26)) + out;
    n = Math.floor(n / 26) - 1;
  } while (n >= 0);
  return out;
}

const camel = (name) =>
  name.replace(/^--(signal-)?/, "").replace(/-(\w)/g, (_, c) => c.toUpperCase());

/**
 * Everything the canvases draw with, read once per theme change.
 * `get(name)` returns a token's computed value (theme.js passes
 * getComputedStyle). Never call this per frame.
 */
function resolvePalette(get) {
  const read = (name) => String(get(name) ?? "").trim();
  const tracks = TRACK_HUE_NAMES.map((n) => ({
    wave: read(`--track-${n}-wave`),
    body: read(`--track-${n}-body`),
    bodyAlt: read(`--track-${n}-body-alt`),
    edge: read(`--track-${n}-edge`),
    label: read(`--track-${n}-label`),
  }));
  const buses = Array.from({ length: BUS_HUES }, (_, i) => ({
    spine: read(`--bus-${i + 1}-spine`),
    band: read(`--bus-${i + 1}-band`),
    text: read(`--bus-${i + 1}-text`),
  }));
  const signals = {};
  const numbers = {};
  const marks = {};
  const surfaces = {};
  const roles = {};
  const labels = [];
  const done = new Set([
    ...TRACK_PARTS.flatMap((p) => trackTokens(p)),
    ...busTokens(),
    ...SHADOW_TOKENS,
  ]);
  for (const name of SEMANTIC_TOKENS) {
    if (done.has(name)) continue;
    const value = read(name);
    if (NUMBER_TOKENS.includes(name)) numbers[camel(name)] = Number.parseFloat(value);
    else if (name.startsWith("--signal-")) signals[camel(name)] = value;
    else if (name.startsWith("--role-")) roles[camel(name.replace("--role-", "--"))] = value;
    else if (name.startsWith("--label-")) labels.push(value);
    else if (/^--(playhead|play-start|selection-range|gain-line|automation-line|ruler-)/.test(name))
      marks[camel(name)] = value;
    else surfaces[camel(name)] = value;
  }
  return {
    tracks,
    buses,
    signals,
    numbers,
    marks,
    surfaces,
    roles,
    labels,
    font: read("--font-ui") || "system-ui, sans-serif",
    mono: read("--font-mono") || "ui-monospace, monospace",
  };
}

const HEX = /^#[0-9a-f]{6}$/i;
const RGBA = /^rgb\(\s*\d{1,3}\s+\d{1,3}\s+\d{1,3}\s*(\/\s*(0|1|0?\.\d+))?\s*\)$/i;

/**
 * A user theme from its manifest (docs/design/GUI-DESIGN.md, "Themes"):
 *   { name, base: "light" | "dark", density?: "comfortable" | "compact",
 *     tokens: { "--semantic-token": "#rrggbb" | "rgb(r g b / a)" | "0.35" } }
 * Returns { errors, attribute, base, density, css }. `css` is empty when
 * anything is wrong: a theme is applied whole or not at all.
 */
function themeFromManifest(manifest) {
  const errors = [];
  const name = String(manifest?.name ?? "").trim();
  if (!name) errors.push("name is missing");
  const base = manifest?.base;
  if (base !== "light" && base !== "dark") errors.push(`base must be light or dark, not ${base}`);
  const density = manifest?.density ?? "comfortable";
  if (density !== "comfortable" && density !== "compact") errors.push(`unknown density ${density}`);
  const lines = [];
  for (const [token, raw] of Object.entries(manifest?.tokens ?? {})) {
    const value = String(raw).trim();
    if (!SEMANTIC_TOKENS.includes(token) || SHADOW_TOKENS.includes(token)) {
      errors.push(`${token} is not a theme token`);
      continue;
    }
    const isNumber = NUMBER_TOKENS.includes(token);
    const valid = isNumber ? /^(0|1|0?\.\d+)$/.test(value) : HEX.test(value) || RGBA.test(value);
    if (!valid) {
      errors.push(`${token}: ${value} is not a ${isNumber ? "number from 0 to 1" : "colour"}`);
      continue;
    }
    lines.push(`  ${token}: ${value};`);
  }
  const attribute = name
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
  const css = errors.length
    ? ""
    : `:root[data-user-theme="${attribute}"] {\n${lines.join("\n")}\n}\n`;
  return { errors, attribute, base, density, css };
}
// -- end of grammar.js --
// -- labels.js (copy) --
// Clip labels that say something, and how clips of one recording relate
// (owner, 2026-10-18). Pure: the timeline, the prototype and the tests use
// the same rules. Spec: docs/design/GUI-DESIGN.md, "Clip labels" and
// "Recordings, sessions, speakers". A label is never identity: the content
// hash is.

/**
 * Label templates by available width (px). Tokens: {person} {interview}
 * {file} {take} {in} {out} {words} {part}. The user may change them in
 * settings (WP27/WP35); a template whose tokens are all empty draws nothing.
 */
const DEFAULT_TEMPLATES = {
  xs: "",
  s: "{person}",
  m: "{person} {take}",
  l: "{person} {take} · {in}–{out}",
  xl: "{person} {take} · {in}–{out} · “{words}”",
};
/** Minimum widths of the tiers; below `s` only the file mark is drawn. */
const TIERS = [
  ["xl", 400],
  ["l", 170],
  ["m", 100],
  ["s", 48],
  ["xs", 0],
];
const PADDING_PX = 8;
const FIRST_WORDS = 5;

const stem = (name) => String(name ?? "").replace(/\.[^.]+$/, "");

function clock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, "0");
  return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}

/**
 * What we know about a clip, as label tokens. `words` are timeline words
 * ({start, end, text} in project frames). `in`/`out` are on the recording's
 * own clock (the source range), so two clips cut from one file read as
 * consecutive or gapped.
 */
function labelFacts(project, clip, words = []) {
  const rate = project?.rate || 48_000;
  const media = project?.media?.find((m) => m.id === clip.media) ?? {};
  const file = stem(media.name);
  const person =
    project?.people?.find((p) => p.id === media.person)?.name ||
    project?.interviews?.find((i) => i.id === media.interview)?.title ||
    file;
  const numbers = file.match(/(\d+)(?!.*\d)/);
  const end = clip.start + clip.length;
  const under = words
    .filter((word) => word.start >= clip.start && word.start < end)
    .slice(0, FIRST_WORDS)
    .map((word) => word.text)
    .join(" ");
  return {
    name: clip.name ?? "",
    person,
    interview: project?.interviews?.find((i) => i.id === media.interview)?.title ?? "",
    file,
    take: numbers ? numbers[1] : "",
    in: clock(clip.offset / rate),
    out: clock((clip.offset + clip.length) / rate),
    words: under,
    part: "",
  };
}

function fill(template, facts) {
  return template
    .replace(/\{(\w+)\}/g, (_, token) => String(facts[token] ?? ""))
    .replace(/“”/g, "")
    .replace(/\s*·\s*(?=·|$)/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

/**
 * The label for a clip `width` px wide. A manual name (Clip.name) wins
 * whenever it fits. Otherwise the widest tier whose text fits is used,
 * stepping down a tier rather than overflowing. `measure(text)` -> px.
 */
function clipLabel(facts, width, { measure, templates = DEFAULT_TEMPLATES } = {}) {
  const room = width - PADDING_PX;
  const fits = (text) => measure(text) <= room;
  const start = TIERS.findIndex(([, min]) => width >= min);
  if (facts.name) {
    if (fits(facts.name)) return facts.name;
    return start >= 0 && width >= TIERS.at(-2)[1] ? truncateToFit(facts.name, fits) : "";
  }
  for (let i = Math.max(0, start); i < TIERS.length; i += 1) {
    const text = fill(templates[TIERS[i][0]] ?? "", facts);
    if (text === "") return "";
    if (fits(text)) return text;

  return "";

function truncateToFit(text, fits) {
  for (let n = text.length - 1; n > 3; n -= 1) {
    const cut = truncateMiddle(text, n);
    if (fits(cut)) return cut;
  }
  return "";

/**
 * Shorten a file name in the middle to about `max` characters, keeping a
 * trailing number whole ("haast…ille_12"): numbers tell takes apart, so they
 * are never cut. Finnish names run long; this keeps both ends readable.
 */
function truncateMiddle(text, max) {
  if (text.length <= max) return text;
  const tail = text.match(/[^\d]{0,4}\d+$/)?.[0] ?? "";
  const keepEnd = Math.max(tail.length, Math.floor(max / 2));
  const keepStart = Math.max(1, max - keepEnd - 1);

/** Each clip of a recording, numbered by its position in the source: id -> {n, of}. */

    for (const clip of track.clips) if (clip.media === mediaId) clips.push(clip);

  clips.sort((a, b) => a.offset - b.offset || a.start - b.start);
  return new Map(clips.map((clip, i) => [clip.id, { n: i + 1, of: clips.length }]));

  const media = new Set();
  for (const track of project?.tracks ?? []) {
    for (const clip of track.clips) if (selection.has(clip.id)) media.add(clip.media);
  }
  const out = new Set();
  if (media.size === 0) return out;
  for (const track of project.tracks) {
    for (const clip of track.clips) {
      if (media.has(clip.media) && !selection.has(clip.id)) out.add(clip.id);
    }
  }
  return out;
}
