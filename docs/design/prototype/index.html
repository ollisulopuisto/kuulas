<title>kuulas prototype</title>
<!--
  kuulas GUI prototype: the visual source of truth for docs/design/GUI-DESIGN.md.
  One offline file, fake data, no audio at all (Space only animates the playhead).
  URL parameters (also set by the bar at the top):
    screen = main | transcript | history | candidates | palette | focus | empty | error
    theme  = system | light | dark      lang = en | fi      density = comfortable | compact
    clean  = 1   hides the prototype bar (used for the screenshots)
  The token block below is a copy of ui/tokens.css: never edit it here, run
  `node docs/design/sync-tokens.mjs` after changing ui/tokens.css.
-->
<style>
/* kuulas design tokens. The single source of colour, type, spacing, motion
   and size for the editor (style.css) and its canvases (theme.js reads these
   custom properties). Spec: docs/design/GUI-DESIGN.md, "Visual language".
   Visual reference: docs/design/prototype/index.html (it embeds a copy of
   this file; ui/tests/tokens.test.js keeps the two identical and checks the
   contrast pairs, so change a value here and the test tells you what broke).

   Rules for editing this file:
   - Components use the semantic tokens (--surface-*, --text-*, --accent ...),
     never a hex value and never a --track-* token for anything but tracks.
   - The dark values appear twice (OS preference and explicit choice). Keep
     the two blocks identical; the test fails if they drift.
   - Every colour change keeps the contrast pairs in tokens.test.js passing. */

/* -- theme-independent tokens ---------------------------------------------- */
:root {
  /* Type. System fonts: native feel, no download, full Finnish coverage. */
  --font-ui:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
    system-ui, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --font-mono:
    ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --text-xs: 11px; /* ruler labels, badges, key chips */
  --text-sm: 12px; /* controls, panel headers, meta */
  --text-md: 13px; /* body: the default */
  --text-lg: 15px; /* transcript reading text, dialog titles */
  --text-xl: 20px; /* the timecode */
  --leading-tight: 1.25;
  --leading-body: 1.45;
  --leading-read: 1.65; /* transcript */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;

  /* Spacing: a 4 px grid with two half steps for dense rows. */
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 6px;
  --space-4: 8px;
  --space-5: 12px;
  --space-6: 16px;
  --space-7: 24px;
  --space-8: 32px;

  /* Radii. Clips are square (canvas); everything the hand touches is soft. */
  --radius-xs: 2px; /* badges on clips, key chips */
  --radius-sm: 4px; /* buttons, inputs, chips in toolbars */
  --radius-md: 6px; /* popovers, cards, list rows */
  --radius-lg: 10px; /* dialogs, the command palette */
  --radius-pill: 999px; /* state chips */

  /* Motion. Short and functional; prefers-reduced-motion sets them to 0. */
  --dur-fast: 90ms; /* hover, press */
  --dur-base: 140ms; /* chips appearing, tabs */
  --dur-layout: 120ms; /* lane height changes, focus mode shrink (WP28) */
  --dur-flash: 600ms; /* "this changed" flash after undo/redo */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);

  /* Focus ring: always visible on keyboard focus, never removed. */
  --focus-width: 2px;
  --focus-offset: 2px;

  /* Layout sizes (comfortable density). JS constants that must match are
     named next to each: lanes.js RULER_HEIGHT = --ruler-h. */
  --topbar-h: 44px;
  --statusbar-h: 26px;
  --overview-h: 20px;
  --ruler-h: 24px;
  --heads-w: 232px;
  --heads-w-min: 180px;
  --heads-w-max: 360px;
  --sidebar-w: 320px;
  --sidebar-w-min: 260px;
  --sidebar-w-max: 480px;
  --dock-h: 30vh; /* transcript dock */
  --dock-h-min: 120px;
  --control-h: 26px;
  --control-h-sm: 20px; /* M / S buttons, chips inside headers */
  --lane-h: 56px; /* lanes.js DEFAULT_LANE */
  --strip-h: 16px; /* focus-mode strips (WP28) */
  --reading-max: 72ch; /* transcript line length */
}

:root[data-density="compact"] {
  --text-md: 12px;
  --text-lg: 14px;
  --text-xl: 18px;
  --topbar-h: 38px;
  --statusbar-h: 22px;
  --control-h: 22px;
  --control-h-sm: 18px;
  --heads-w: 200px;
  --sidebar-w: 280px;
  --lane-h: 40px;
}

/* -- light (the default when the OS asks for light) ---------------------- */
:root {
  color-scheme: light;
  --surface-app: #e8ecee; /* behind everything; gaps between docks */
  --surface-lane: #f6f8f9; /* timeline background */
  --surface-lane-current: #e9f3f1; /* the current track's lane (↑/↓ cursor) */
  --surface-panel: #ffffff; /* headers, panels, top and status bars */
  --surface-raised: #ffffff; /* popovers, palette, toasts (plus shadow) */
  --surface-sunken: #eef1f3; /* inputs, wells, the ruler */
  --surface-hover: #eef2f4;
  --surface-active: #e2e8eb;
  --surface-scrim: rgb(16 24 28 / 0.32); /* behind modal dialogs */

  --border-subtle: #e3e8eb; /* lane separators, list dividers */
  --border: #d3dadd; /* panel edges, control outlines at rest */
  --border-strong: #858f96; /* input outlines (>= 3:1 on panel) */

  --text: #13191c;
  --text-secondary: #48545a;
  --text-tertiary: #5c6870; /* >= 4.5:1 on every surface: still body text */
  --text-disabled: #9aa5ab; /* disabled only; exempt from contrast */
  --text-on-accent: #ffffff;

  --accent: #0a7a6b; /* primary buttons, focus, range selection edges */
  --accent-hover: #086a5d;
  --accent-text: #0a6e60; /* accent-coloured text on panels */
  --accent-subtle: #dff1ed; /* selected rows, current word background */
  --focus-ring: #0a7a6b;

  --selection-outline: #10161a; /* selected clip: 2 px, neutral, any hue */
  --selection-range: rgb(10 122 107 / 0.14); /* in/out band on scoped lanes */
  --partner-outline: #48545a; /* dashed: what a move takes along (WP19a) */
  --playhead: #d93a26;
  --play-start: #5c6870; /* where the last play started (dashed) */
  --gain-line: #13191c;
  --automation-line: #48545a;
  --ruler-text: #48545a;
  --ruler-tick: #a9b4ba;

  --warn: #b97a00; /* fills and strokes */
  --warn-text: #8a5300;
  --warn-subtle: #fff1d6;
  --danger: #c8321f;
  --danger-text: #b42d1c;
  --danger-subtle: #fde8e4;
  --ok: #1e8a4c;
  --ok-text: #18794a;
  --candidate: #c8321f; /* cut candidates: striped band + "cut?" label */
  --candidate-fill: rgb(200 50 31 / 0.12);
  --muted-hatch: rgb(19 25 28 / 0.28);

  --shadow-raised: 0 6px 20px rgb(16 24 28 / 0.14), 0 0 0 1px rgb(16 24 28 / 0.08);
  --shadow-dialog: 0 18px 48px rgb(16 24 28 / 0.22), 0 0 0 1px rgb(16 24 28 / 0.08);

  /* Track hues. One per speaker (tracks with the same speaker share it),
     cycling 0..5; music has its own low-chroma role colour; buses are neutral.
     wave: waveform bars; body: clip fill; edge: clip outline and header
     swatch; label: clip name text on body. Order picked for colour-blind
     separation of the first four (see GUI-DESIGN.md). */
  --track-0-wave: #1157a4;
  --track-0-body: #ecf4ff;
  --track-0-edge: #1b589e;
  --track-0-label: #164781;
  --track-1-wave: #b97a00;
  --track-1-body: #fbf2e6;
  --track-1-edge: #a06700;
  --track-1-label: #693c00;
  --track-2-wave: #ad456b;
  --track-2-body: #ffeff3;
  --track-2-edge: #a9496b;
  --track-2-label: #742945;
  --track-3-wave: #0098c0;
  --track-3-body: #e7f7fc;
  --track-3-edge: #0084a9;
  --track-3-label: #005370;
  --track-4-wave: #643185;
  --track-4-body: #f7f0fd;
  --track-4-edge: #633481;
  --track-4-label: #5a3473;
  --track-5-wave: #4e8626;
  --track-5-body: #eef6ea;
  --track-5-edge: #51852f;
  --track-5-label: #2b5409;
  --track-music-wave: #8a7f69;
  --track-music-body: #f2f0ec;
  --track-music-edge: #7a715e;
  --track-music-label: #4f4735;
}

/* ===== base ============================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--surface-app); color: var(--text);
  font: var(--weight-regular) var(--text-md) / var(--leading-body) var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
kbd {
  display: inline-block; min-width: 18px; padding: 0 4px; height: 18px;
  font: var(--weight-medium) var(--text-xs)/16px var(--font-ui); text-align: center;
  color: var(--text-secondary); background: var(--surface-sunken);
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--radius-xs);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ===== buttons and chips ================================================= */
.button {
  display: inline-flex; align-items: center; gap: var(--space-3);
  height: var(--control-h); padding: 0 var(--space-5);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-panel); color: var(--text); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
}
.button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-strong); }
.button:active:not(:disabled) { background: var(--surface-active); }
.button:disabled { color: var(--text-disabled); cursor: default; }
.button.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); font-weight: var(--weight-strong); }
.button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.button.ghost { border-color: transparent; background: transparent; }
.button.ghost:hover:not(:disabled) { background: var(--surface-hover); border-color: transparent; }
.button.small { height: var(--control-h-sm); padding: 0 var(--space-4); font-size: var(--text-sm); }
.icon-button { width: var(--control-h); padding: 0; justify-content: center; }
.chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: 22px; padding: 0 var(--space-4); border-radius: var(--radius-pill);
  font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap;
  border: 1px solid var(--border); color: var(--text-secondary); background: transparent;
}
.chip svg.i { width: 14px; height: 14px; }
.chip.warn { background: var(--warn-subtle); border-color: var(--warn); color: var(--warn-text); }
.chip.danger { background: var(--danger-subtle); border-color: var(--danger); color: var(--danger-text); }
.chip.info { color: var(--text); border-color: var(--border-strong); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--border-strong); }

/* ===== prototype switcher (not part of the design) ====================== */
.proto-bar {
  height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  background: #000; color: #ddd; font: 12px/1 var(--font-ui); overflow-x: auto; white-space: nowrap;
}
.proto-bar b { color: #fff; margin-right: 4px; }
.proto-bar select { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; height: 22px; }
.proto-bar .sep { width: 1px; height: 16px; background: #444; }
body.clean .proto-bar { display: none; }

/* ===== app frame ========================================================= */
.app {
  height: calc(100vh - 30px);
  display: grid;
  grid-template-columns: var(--heads-w) minmax(0, 1fr) var(--sidebar-w);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--dock-h) var(--statusbar-h);
  grid-template-areas: "top top top" "heads timeline side" "dock dock side" "status status status";
  gap: 1px; background: var(--border);
}
body.clean .app { height: 100vh; }
.app > * { background: var(--surface-panel); min-width: 0; min-height: 0; }

/* ===== top bar =========================================================== */
.topbar { grid-area: top; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-4) 0 0; }
.project {
  width: var(--heads-w); flex: none; height: 100%; display: flex; flex-direction: column; justify-content: center;
  padding: 0 var(--space-5); border-right: 1px solid var(--border-subtle); min-width: 0; cursor: pointer;
}
.project:hover { background: var(--surface-hover); }
.project .name { font-weight: var(--weight-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: var(--leading-tight); }
.project .edit { font-size: var(--text-xs); color: var(--text-secondary); display: flex; gap: var(--space-2); align-items: center; white-space: nowrap; overflow: hidden; }
.project .edit svg.i { width: 12px; height: 12px; }
.transport { display: flex; align-items: center; gap: var(--space-4); padding-left: var(--space-2); }
.play {
  height: 30px; min-width: 30px; padding: 0 var(--space-5) 0 var(--space-4); gap: var(--space-3);
  background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); font-weight: var(--weight-strong);
}
.play:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.play svg.i { fill: currentColor; stroke: none; }
.play:disabled { background: var(--surface-panel); border-color: var(--border); color: var(--text-disabled); }
.play kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }
.timecode { font: var(--weight-strong) var(--text-xl)/1 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; min-width: 9.2ch; }
.timecode .ms { color: var(--text-secondary); font-weight: var(--weight-medium); }
.modes { display: flex; gap: var(--space-3); align-items: center; min-width: 0; overflow: hidden; }
.spacer { flex: 1; }
.job { display: inline-flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); color: var(--text-secondary); white-space: nowrap; }
.ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-active) 0); -webkit-mask: radial-gradient(circle 5px, transparent 98%, #000 100%); mask: radial-gradient(circle 5px, transparent 98%, #000 100%); }
.cmd-button { color: var(--text-secondary); gap: var(--space-4); padding: 0 var(--space-3) 0 var(--space-4); }
.toolgroup { display: flex; gap: var(--space-1); }

/* ===== track headers ===================================================== */
.heads { grid-area: heads; display: flex; flex-direction: column; }
.heads-top {
  height: calc(var(--overview-h) + var(--ruler-h)); flex: none; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 var(--space-4) var(--space-2) var(--space-5); border-bottom: 1px solid var(--border);
  font-size: var(--text-xs); color: var(--text-secondary);
}
.heads-scroll { flex: 1; overflow: hidden; }
.track-header {

const BIN = 0.005; // 5 ms bins over 690..830 s
const BASE = 690, SPAN = 140, NBINS = Math.round(SPAN / BIN);
const AMP = {};
function buildAmps() {
  let seed = 7;
  for (const [id, turns] of Object.entries(TURNS)) {
    const r = rng((seed += 101));
    const a = new Float32Array(NBINS);
    const level = id === "annab" ? 0.5 : id === "pekka" ? 0.75 : 1;
    for (let i = 0; i < NBINS; i++) a[i] = 0.006 + r() * 0.01 + (id === "pekka" ? 0.02 : 0);
    for (const [t0, t1] of turns) {
      let t = t0;
      while (t < t1) {
        const dur = 0.11 + r() * 0.16;
        const amp = (0.28 + r() * 0.55) * level;
        const b0 = Math.round((t - BASE) / BIN), b1 = Math.round((t + dur - BASE) / BIN);
        for (let b = Math.max(0, b0); b < Math.min(NBINS, b1); b++) {
          const x = (b - b0) / Math.max(1, b1 - b0);
          const v = Math.sin(Math.PI * x) ** 0.8 * amp * (0.72 + 0.28 * r());
          if (v > a[b]) a[b] = v;
        }
        t += dur + (r() < 0.14 ? 0.18 + r() * 0.4 : r() * 0.035);
      }
    }
    if (id === "annab") { // a little of Ville bleeding into Anna's backup mic
      for (const [t0, t1] of TURNS.ville) for (let t = t0; t < t1; t += BIN) { const b = Math.round((t - BASE) / BIN); if (b >= 0 && b < NBINS) a[b] = Math.max(a[b], 0.04 + 0.05 * r()); }
    }
    AMP[id] = a;
  }
  const r = rng(99), m = new Float32Array(NBINS);
  for (let i = 0; i < NBINS; i++) {
    const t = BASE + i * BIN;
    const beat = 0.5 + 0.5 * Math.max(0, Math.sin(t * Math.PI * 4)) ** 3;
    m[i] = (0.28 + 0.2 * beat + 0.08 * Math.sin(t * 0.7)) * (0.85 + 0.15 * r());
  }
  AMP.music1 = m;
  // One syllable that clips on Pekka's Zoom line (drawn with a danger cap).
  for (let b = Math.round((767.3 - BASE) / BIN); b < Math.round((767.42 - BASE) / BIN); b++) AMP.pekka[b] = 1;
}
buildAmps();
function peak(track, t0, t1) {
  const a = AMP[track]; if (!a) return 0;
  let b0 = Math.floor((t0 - BASE) / BIN), b1 = Math.ceil((t1 - BASE) / BIN);
  b0 = Math.max(0, b0); b1 = Math.min(NBINS, Math.max(b0 + 1, b1));
  let m = 0; for (let b = b0; b < b1; b++) if (a[b] > m) m = a[b];
  return m;
}

// ---------------------------------------------------------------- screens
function applyScreen() {
  const s = S.screen;
  S.selection = new Set(); S.words = new Set(); S.focus = null; S.palette = false; S.tab = "inspector";
  S.panel = "timeline"; S.current = "ville"; S.jobsOpen = false; S.groupEditing = true; S.speed = 1;
  S.view = [740, 772]; S.playhead = 754.567;
  if (s === "main") { S.selection = new Set(["v1"]); S.speed = 1.5; }
  if (s === "transcript") { S.panel = "transcript"; S.words = new Set(["3:9", "3:10", "3:11"]); S.current = "anna"; }
  if (s === "history") { S.tab = "history"; S.panel = "side"; }
  if (s === "candidates") { S.tab = "candidates"; S.panel = "side"; S.playhead = 755.8; }
  if (s === "palette") { S.selection = new Set(["v1"]); S.palette = true; }
  if (s === "focus") { S.focus = "ville"; S.selection = new Set(["v1"]); }
  if (s === "error") { S.selection = new Set(["p1"]); S.groupEditing = false; S.jobsOpen = true; }
}

// ---------------------------------------------------------------- rendering: chrome
const $ = (id) => document.getElementById(id);
function render() {
  const root = document.documentElement;
  if (S.theme === "system") root.removeAttribute("data-theme"); else root.dataset.theme = S.theme;
  if (S.density === "compact") root.dataset.density = "compact"; else root.removeAttribute("data-density");
  root.lang = S.lang;
  $("p-screen").value = S.screen; $("p-theme").value = S.theme; $("p-lang").value = S.lang; $("p-density").value = S.density;
  const empty = S.screen === "empty";
  renderTop(empty); renderHeads(empty); renderDock(empty); renderSide(empty); renderStatus(empty); renderOverlays();
  for (const n of document.querySelectorAll("[data-panel]")) n.toggleAttribute("data-focused", n.dataset.panel === S.panel);
  $("empty").hidden = !empty;
  if (empty) $("empty").innerHTML = `<div class="drop-card">${icon("import", "i big")}<h2>${tr("emptyTitle")}</h2><p>${tr("emptyText")}</p>
    <div class="row"><button class="button primary" type="button">${icon("import")}${tr("import")}… ${kbd(MOD + "I")}</button>
    <button class="button" type="button">${icon("open")}${tr("emptyHnd")}</button></div><p class="formats">${tr("formats")}</p></div>`;
  requestAnimationFrame(drawAll);
}

function timecode(t) {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = Math.floor(t % 60), ms = Math.round((t % 1) * 1000);
  const sep = S.lang === "fi" ? "," : ".";
  return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}<span class="ms">${sep}${String(ms).padStart(3, "0")}</span>`;
}

function renderTop(empty) {
  const chips = [];
  if (!empty) {
    if (S.speed !== 1) chips.push(`<button class="chip warn" type="button" title=". ${tr("pSpeed")}">${fmtNum(S.speed, 1)}× ${kbd(".")}</button>`);
    if (!S.groupEditing) chips.push(`<button class="chip warn" type="button" title="E">${icon("unlink")}${tr("groupOff")} ${kbd("E")}</button>`);
    if (S.screen === "candidates") chips.push(`<button class="chip warn" type="button" title="⇧S">${tr("soloChip", { n: name("ville") })} ${kbd("⇧S")}</button>`);
    if (S.focus) chips.push(`<span class="chip info">${icon("focus")}${tr("focusChip", { n: name(S.focus) })} ${kbd("Esc")}</span>`);
    if (S.screen === "error") chips.push(`<span class="chip danger" role="status" title="${tr("reconnectTitle")}">${icon("warn")}${tr("reconnect")}</span>`);
  }
  $("topbar").innerHTML = `
    <div class="project" title="${MOD}O">
      <span class="name">${empty ? tr("newProject") : tr("project")}</span>

    </div>
    <div class="transport">
      <button class="button play" id="play" type="button" aria-keyshortcuts="Space" ${empty ? "disabled" : ""}>${icon(S.playing ? "stop" : "play")}${tr(S.playing ? "stop" : "play")} ${kbd("Space")}</button>
      <output class="timecode" aria-label="Playhead">${timecode(empty ? 0 : S.playhead)}</output>
    </div>
    <div class="modes">${chips.join("")}</div>
    <span class="spacer"></span>
    ${empty ? "" : `<button class="chip" id="jobs" type="button" aria-expanded="${S.jobsOpen}"><span class="ring" style="--p:64"></span>${tr("jobs")}</button>`}
    <div class="toolgroup">
      <button class="button ghost icon-button" type="button" title="${tr("undo")} · ${MOD}Z" aria-label="${tr("undo")}" ${empty ? "disabled" : ""}>${icon("undo")}</button>
      <button class="button ghost icon-button" type="button" title="${tr("redo")} · ⇧${MOD}Z" aria-label="${tr("redo")}" disabled>${icon("redo")}</button>
    </div>
    <button class="button ${empty ? "primary" : ""}" type="button" title="${MOD}I">${icon("import")}${tr("import")}</button>
    <button class="button" type="button" title="${MOD}E" ${empty ? "disabled" : ""}>${icon("export")}${tr("export")}</button>
    <button class="button cmd-button" id="cmd" type="button">${icon("search")}${tr("commands")} ${kbd(MOD + "K")}</button>`;
  $("play").onclick = togglePlay;
  $("cmd").onclick = () => { S.palette = true; render(); };
  const jobs = $("jobs"); if (jobs) jobs.onclick = () => { S.jobsOpen = !S.jobsOpen; render(); };
}

function laneLayout() {
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lane-h")) || 48;
  const strip = 16;
  const rows = [];
  const avail = $("stack").clientHeight - 24;
  let y = 0;
  const focusTracks = S.focus ? TRACKS.filter((t) => t.id === S.focus) : [];
  const busH = 30;
  const big = S.focus ? Math.max(H, avail - (TRACKS.length - focusTracks.length) * strip - busH) : H;
  for (const t of TRACKS) {
    const h = S.focus ? (t.id === S.focus ? big : strip) : (S.screen === "empty" ? 0 : H);
    rows.push({ kind: "track", t, y, h }); y += h;
  }
  if (S.screen !== "empty") rows.push({ kind: "bus", y, h: busH });
  return rows;
}

function renderHeads(empty) {
  const rows = laneLayout();
  const soloed = S.screen === "candidates" ? "ville" : null; // candidates screen shows an active solo
  let html = `<div class="heads-top"><span>${empty ? "" : tr("tracks", { n: TRACKS.length })}</span></div><div class="heads-scroll">`;
  if (!empty) for (const r of rows) {
    if (r.kind === "bus") {
      html += `<div class="bus-header" style="height:${r.h}px">${icon("bus")}<span class="bus-name">${tr("busLabel")}: ${tr("bus")}</span>
        <button class="ms-button mute" type="button" aria-pressed="false" aria-label="${tr("mute")}">M</button>
        <label class="slider-control gain"><input type="range" min="-60" max="12" value="0" aria-label="gain"><output>${fmtNum(0)} dB</output></label></div>`;
      continue;
    }
    const t = r.t;
    const cls = ["track-header"];
    if (S.current === t.id) cls.push("current");
    if (r.h < 30) cls.push("strip"); else if (r.h < 44) cls.push("compact");
    const unheard = soloed && soloed !== t.id;
    if (unheard) cls.push("unheard");
    const roleText = tr(t.kind === "speechMix" ? "speechMix" : t.kind);
    const role = `<span class="role" title="${unheard ? tr("notHeard") : roleText}" aria-label="${roleText}">${icon(t.kind === "music" ? "note" : t.kind === "speechMix" ? "mics" : "mic")}</span>`;
    const gain = `${fmtNum(t.gain)} dB`;
    const pan = t.pan === 0 ? "C" : (t.pan < 0 ? "L" : "R") + " " + Math.round(Math.abs(t.pan) * 100);
    html += `<section class="${cls.join(" ")}" data-track="${t.id}" style="height:${r.h}px; --track-colour: var(--track-${t.hue}-edge)">
      <div class="th-top">${role}<span class="track-name" title="${name(t.id)}">${name(t.id)}</span>
        <span class="ms"><button class="ms-button mute ${unheard ? "implicit" : ""}" type="button" data-ms="mute" aria-pressed="${!!t.mute}" aria-label="${tr("mute")} ${name(t.id)}" title="${tr("mute")} · ⇧M">M</button>
        <button class="ms-button solo" type="button" data-ms="solo" aria-pressed="${soloed === t.id}" aria-label="${tr("solo")} ${name(t.id)}" title="${tr("solo")} · ⇧S">S</button></span></div>
      <div class="th-controls"><label class="slider-control gain"><input type="range" min="-60" max="12" step="0.1" value="${t.gain}" aria-label="gain"><output>${gain}</output></label>
        <label class="slider-control pan"><input type="range" min="-100" max="100" value="${t.pan * 100}" aria-label="pan"><output>${pan}</output></label></div>
    </section>`;
  }
  $("heads").innerHTML = html + "</div>";
  for (const b of $("heads").querySelectorAll("[data-ms]")) b.onclick = (e) => { const p = b.getAttribute("aria-pressed") === "true"; b.setAttribute("aria-pressed", String(!p)); e.stopPropagation(); };
  for (const h of $("heads").querySelectorAll(".track-header")) h.onclick = () => { S.current = h.dataset.track; render(); };
}

function renderDock(empty) {
  const head = `<div class="panel-head"><h2>${tr("transcript")}</h2><span class="meta">${empty ? "" : tr("followPlay")}</span><span class="spacer"></span>
    ${empty ? "" : `<button class="button ghost small" type="button" aria-label="search">${icon("search")}</button>`}</div>`;
  if (empty) {
    $("dock").innerHTML = head + `<div class="empty-panel"><strong>${tr("noTranscript")}</strong><span>${tr("noTranscriptHint")}</span></div>`;
    return;
  }
  const hue = (id) => TRACKS.find((t) => t.id === id).hue;
  let html = head + `<div class="transcript" id="tx">`;
  tr("paragraphs").forEach(([who, when, text], pi) => {
    const words = text.split(" ");
    const dim = S.focus && who !== S.focus;
    html += `<div class="para ${dim ? "dim" : ""}"><div class="speaker" style="--track-colour: var(--track-${hue(who)}-edge)"><b>${name(who)}</b><span>${S.lang === "fi" ? when.replace(".", ",") : when}</span></div><p class="text">`;
    html += words.map((w, wi) => {
      const k = `${pi}:${wi}`; const c = ["w"];
      if (S.words.has(k)) c.push("sel");
      if (pi === 3 && wi >= 9 && wi <= 11 && !S.words.size) c.push("cand");
      if (pi === 1 && wi === 0) c.push("cut");
      if (pi === 1 && wi === 12) c.push("low");
      if (pi === 3 && wi === 2 && S.screen !== "transcript") c.push("now");
      const joinSel = S.words.has(k) && S.words.has(`${pi}:${wi + 1}`);
      return `<span class="${c.join(" ")}${joinSel ? " join" : ""}" data-w="${k}">${w}${joinSel ? " " : ""}</span>${joinSel || wi === words.length - 1 ? "" : " "}`;
    }).join("");
    html += `</p></div>`;
    if (pi === 2) html += `<div class="para"><div class="speaker" style="--track-colour: var(--border-strong)"><b>${S.lang === "fi" ? "Kertoja" : "Narrator"}</b><span>12:29.4</span></div><p class="text"><span class="placeholder">${tr("narration")}<small>${tr("toRecord")}</small></span></p></div>`;
  });
  html += "</div>";
  if (S.words.size) html += `<div class="word-pop" id="wordpop" role="toolbar" aria-label="words"><button class="button" type="button">${icon("cut")}${tr("wordCut")} ${kbd("⌫")}</button><button class="button ghost" type="button">${tr("wordMark")} ${kbd("⌥D")}</button><button class="button ghost" type="button">${icon("edit")}${tr("wordCorrect")} ${kbd("Enter")}</button></div>`;
  $("dock").innerHTML = html;
  const first = $("dock").querySelector(".w.sel");
  if (first) {
    const tx = $("tx"); tx.scrollTop = Math.max(0, first.offsetTop - tx.offsetTop - 70);
    const pop = $("wordpop"), d = $("dock").getBoundingClientRect(), r = first.getBoundingClientRect();
    pop.style.left = `${Math.max(8, r.left - d.left)}px`; pop.style.top = `${r.top - d.top - 40}px`;
  }
  for (const w of $("dock").querySelectorAll(".w")) w.onclick = (e) => {
    if (e.shiftKey && S.words.size) S.words.add(w.dataset.w); else S.words = new Set([w.dataset.w]);
    S.panel = "transcript"; render();
  };
}

function renderSide(empty) {
  const tabs = [["inspector", "sliders"], ["history", "history"], ["candidates", "cut"], ["clips", "layers"]];
  let html = `<div class="tabs" role="tablist">` + tabs.map(([k, ic]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${S.tab === k}" title="${tr(k)}">${icon(ic)}<span class="label">${tr(k)}</span>${k === "candidates" && !empty ? `<span class="count">3</span>` : ""}</button>`).join("") + `</div><div class="side-body">`;
  let foot = "";
  if (S.tab === "inspector") {
    const clipId = [...S.selection][0];
    if (empty || !clipId) {
      html += `<div class="empty-panel"><strong>${tr("noSel")}</strong><span>${tr("noSelHint")}</span></div>`;
    } else {
      const err = S.screen === "error";
      const c = CLIPS.find((x) => x.id === clipId);
      const t = TRACKS.find((x) => x.id === c.track);
      html += `<div class="section"><div class="clip-title" style="--track-colour: var(--track-${t.hue}-edge)"><span class="sw"></span><div><b>${c.label}</b><span>${err ? (S.lang === "fi" ? "Zoom: Pekka · 11:30,0–13:50,0" : "Zoom: Pekka · 11:30.0–13:50.0") : tr("clipMeta")}</span></div></div></div>
      <div class="section"><h3>${tr("level")}</h3>
        <div class="field"><label for="g">${tr("gain")}</label><span class="val"><input class="input ${err ? "invalid" : ""}" id="g" value="${err ? "+40" : fmtNum(-2.5)}" aria-invalid="${err}"><span class="hint">dB</span></span>${kbd("⇧" + MOD + "↑")}
          ${err ? `<span class="field-error">${icon("warn")}${tr("gainErr")}</span>` : ""}</div>
        <div class="field"><label for="p">${tr("pan")}</label><span class="val"><input class="input" id="p" value="${S.lang === "fi" ? "V 10" : "L 10"}"></span>${kbd("⇧⌥←")}</div></div>
      <div class="section"><h3>${tr("fades")}</h3>
        <div class="field"><label for="fi">${tr("fadeIn")}</label><span class="val"><input class="input" id="fi" value="0"><span class="hint">ms</span></span>${kbd("G")}</div>
        <div class="field"><label for="fo">${tr("fadeOut")}</label><span class="val"><input class="input" id="fo" value="30"><span class="hint">ms</span></span></div></div>
      <div class="section"><h3>${tr("sync")}</h3>
        ${err ? `<div class="status-line danger">${icon("warn")}<span><b>${tr("drift")}</b><br><span class="hint">${tr("driftCause")}</span></span></div>
          <div class="button-row"><button class="button small" type="button">${tr("resync")} ${kbd("R")}</button><button class="button small" type="button">${icon("unlink")}${tr("free")} ${kbd("U")}</button></div>`
        : `<div class="status-line ok">${icon("link")}<span>${tr("inSync")}</span></div>`}</div>
      <div class="section"><h3>${tr("voice")}</h3>
        <div class="field"><span class="label">${tr("voice")}</span><span class="val"><select class="select" aria-label="${tr("voice")}"><option>${tr("voiceVal")}</option></select></span><span></span></div>
        <div class="field"><span class="label">${tr("layers")}</span><span class="val"><span class="chip">${tr("layerVal")}</span></span><span></span></div></div>
      <div class="section"><h3>${tr("source")}</h3><dl class="facts"><dt>${tr("file")}</dt><dd>${c.label}</dd><dt>${tr("format")}</dt><dd>${tr("formatVal")}</dd><dt>${tr("stored")}</dt><dd>${tr("storedVal")}</dd></dl></div>`;
    }
  } else if (S.tab === "history") {
    const L = (cls, ic, k, time) => `<li class="${cls}">${icon(ic)}<span class="lab">${tr(k)}</span><span class="t">${time}</span></li>`;
    html += `<ul class="hist">
      <li class="marker">${tr("closed")}</li>
      ${L("", "import", "h1", "21.02")}${L("", "link", "h2", "21.06")}${L("pin", "pin", "h3", "21.40")}${L("", "cut", "h10", "22.03")}
      <li class="marker">${tr("opened")}</li>
      ${L("preview", "cut", "h4", "19.42")}${L("branch", "cut", "h9", "19.44")}${L("", "gain", "h5", "19.51")}
      <li class="head">${icon("mute")}<span class="lab">${tr("h6")}</span><span class="t">${tr("now")}</span></li>
      ${L("future", "link", "h7", "19.58")}${L("future", "wave", "h8", "20.01")}
    </ul>`;
    foot = `<div class="actionbar"><button class="button primary" type="button">${tr("restore")} ${kbd("Enter")}</button><span class="hint">${tr("restoreHint")}</span></div>`;
  } else if (S.tab === "candidates") {
    html += `<div class="cand-summary"><span class="chip info">${tr("candSummary", { o: 3 })}</span><span class="chip">${tr("candCut", { c: 1 })}</span><span class="chip">${tr("candKept", { k: 1 })}</span><span class="spacer"></span><button class="chip" type="button" aria-pressed="false">${tr("showOpen")} ${kbd("⇧" + MOD + "D")}</button></div><ul class="cands">`;
    CANDS.forEach((c, i) => {
      const m = Math.floor(c.at / 60), s = (c.at % 60).toFixed(1).padStart(4, "0");
      const when = `${m}:${S.lang === "fi" ? s.replace(".", ",") : s}`;
      html += `<li class="${i === S.candIndex ? "current" : ""} ${c.state !== "open" ? "done" : ""}"><span class="when">${when}</span><span class="dur">${fmtNum(c.end - c.at)} s</span><span class="state ${c.state}">${tr(c.state)}</span><span class="quote">${tr(c.q)}</span></li>`;
    });
    html += `</ul>`;
    foot = `<div class="actionbar"><div class="preview-bar" style="flex:1 1 100%">${tr("previewBar").map((x, i) => `<span class="${i === 1 ? "skip" : ""}">${x}</span>`).join("")}</div>
      <button class="button" type="button" title="⇧Space">${icon("play")}${tr("preview")}</button><button class="button primary" type="button" title="Enter">${icon("cut")}${tr("apply")}</button><button class="button" type="button" title="⌫">${tr("keep")}</button>
      <span class="hint">${tr("candHint")}</span></div>`;
  } else {
    html += `<div class="empty-panel"><strong>${tr("clips")}</strong><span>WP17</span></div>`;
  }
  $("side").innerHTML = html + `</div>` + foot;
  for (const b of $("side").querySelectorAll(".tab")) b.onclick = () => { S.tab = b.dataset.tab; S.panel = "side"; render(); };
}

function renderOverlays() {

document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); S.palette = !S.palette; render(); return; }
  if (e.key === "Escape") { S.palette = false; S.focus = null; S.panel = "timeline"; render(); $("timeline").focus(); return; }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); return; }
  if (e.key === "F6") { e.preventDefault(); const i = ORDER.indexOf(S.panel); S.panel = ORDER[(i + (e.shiftKey ? 2 : 1)) % 3]; render(); return; }
  if (e.key === "f" && !mod) { S.focus = S.focus ? null : S.current; render(); return; }
  if (e.key === "]" && S.tab === "candidates") { S.candIndex = Math.min(CANDS.length - 1, S.candIndex + 1); render(); }
  if (e.key === "[" && S.tab === "candidates") { S.candIndex = Math.max(0, S.candIndex - 1); render(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { const i = TRACKS.findIndex((t) => t.id === S.current); const n = TRACKS[Math.max(0, Math.min(TRACKS.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))]; S.current = n.id; if (S.focus) S.focus = n.id; render(); }
});
$("timeline").addEventListener("pointerdown", (e) => {
  if (S.screen === "empty") return;
  const rect = e.target.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top - RULER;
  const t = S.view[0] + (x / rect.width) * (S.view[1] - S.view[0]);
  S.panel = "timeline";
  if (y < 0) { S.playhead = t; render(); return; }
  const row = laneLayout().find((r) => y >= r.y && y < r.y + r.h);
  if (!row || row.kind !== "track") { S.selection = new Set(); render(); return; }
  S.current = row.t.id;
  const clip = CLIPS.find((c) => c.track === row.t.id && t >= c.start && t < c.end);
  if (clip) { if (e.shiftKey) S.selection.add(clip.id); else S.selection = new Set([clip.id]); S.tab = "inspector"; } else S.selection = new Set();
  S.playhead = t; render();
});
document.addEventListener("click", (e) => { if (e.target.id === "scrim") { S.palette = false; render(); } });
for (const [id, key] of [["p-screen", "screen"], ["p-theme", "theme"], ["p-lang", "lang"], ["p-density", "density"]]) {
  $(id).addEventListener("change", (e) => {
    S[key] = e.target.value; if (key === "screen") applyScreen();
    const q = new URLSearchParams(location.search); q.set(key, e.target.value); history.replaceState(null, "", "?" + q);
    render();
  });
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new ResizeObserver(() => requestAnimationFrame(() => { renderHeads(S.screen === "empty"); drawAll(); })).observe($("stack"));
applyScreen();
render();
</script>
