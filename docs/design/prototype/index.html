// -- crosstalk.js (copy) --
// What a transcript cut also removes (owner, 2026-10-18). A cut of selected
// words ripple-deletes the whole stretch they cover on every track of the
// edit scope (WP19a), so other speakers' words and audio inside it go too.
// The UI shows that before the key is pressed. Pure; the backend gets the
// same rule as `transcript.cut_preview` (GUI-DESIGN.md, "Crosstalk").

/**
 * `words`: timeline words [{track, start, end, text}] (index = word ref).
 * `selected`: indices of the selected words. `scope`: track ids the cut
 * applies to (the group's tracks). `rate`: frames per second (for seconds).
 * Returns null without a selection, else { range: [start, end], alsoWords:
 * indices of other tracks' words overlapping the range, tracks: [{ track,
 * words, seconds }] for every other track in scope, nothingElse }.
 */
function cutPreview(words, selected, scope, rate = 1) {
  if (!selected?.length) return null;
  const chosen = selected.map((i) => words[i]).filter(Boolean);
  const start = Math.min(...chosen.map((word) => word.start));
  const end = Math.max(...chosen.map((word) => word.end));
  const owners = new Set(chosen.map((word) => word.track));
  const alsoWords = [];
  words.forEach((word, i) => {
    if (owners.has(word.track) || selected.includes(i)) return;
    if (word.start < end && word.end > start && scope.includes(word.track)) alsoWords.push(i);
  });
  const tracks = scope
    .filter((track) => !owners.has(track))
    .map((track) => ({
      track,
      words: alsoWords.filter((i) => words[i].track === track),
      seconds: (end - start) / rate,
    }));
  return { range: [start, end], alsoWords, tracks, nothingElse: tracks.length === 0 };
}

// The motion language (owner, 2026-10-18): gentle cues that pull the eye to
// what changed, never decoration. One setting (full / subtle / off, default
// full, off when the OS asks for reduced motion) decides how every cue plays;
// "off" shows a static highlight carrying the same information. The setting
// lands on <html data-motion>; CSS reads it, canvases ask cueFor. Rules:
// 120-300 ms mostly, one animation at a time, nothing loops except real
// activity (jobs, recording), nothing moves a target under the pointer,
// nothing blocks input, nothing animates during playback but the playhead.
// Spec: docs/design/GUI-DESIGN.md, "Motion".

const MOTION_MODES = ["full", "subtle", "off"];

/**
 * Every cue: what plays, its duration and easing tokens (tokens.css), its
 * length in ms (for canvases), whether it moves things, and the still
 * alternative for "off".
 */
const CUES = {
  "undo-flash": {
    duration: "--dur-flash",
    easing: "--ease-standard",
    ms: 600,
    moves: false,
    still: "a 2 px accent outline on the changed clips for 1.2 s",
  },
  "ripple-close": {
    duration: "--dur-slow",
    easing: "--ease-standard",
    ms: 260,
    moves: true,
    still: "the later material appears in place with the undo flash outline",
  },
  "import-in": {
    duration: "--dur-slow",
    easing: "--ease-standard",
    ms: 240,
    moves: true,
    still: "new tracks appear with the accent outline for 1.2 s",
  },
  "candidate-pulse": {
    duration: "--dur-base",
    easing: "--ease-standard",
    ms: 180,
    moves: false,
    still: "the current candidate's 2 px edges and its highlighted list row",
  },
  "collateral-breathe": {
    duration: "--dur-flash",
    easing: "--ease-standard",
    ms: 600,
    moves: false,
    still: "the collateral hatch at full strength, no change over time",
  },
  "ab-cue": {
    duration: "--dur-base",
    easing: "--ease-standard",
    ms: 140,
    moves: false,
    still: "the active slot stays filled; the other slots are outlined",
  },
  toast: {
    duration: "--dur-base",
    easing: "--ease-standard",
    ms: 140,
    moves: true,
    still: "the message appears and disappears without movement",
  },
  "soft-cut-restore": {
    duration: "--dur-slow",
    easing: "--ease-standard",
    ms: 240,
    moves: false,
    still: "the restored stretch carries the undo flash outline",
  },
  "playhead-ease": {
    duration: "--dur-slow",
    easing: "--ease-standard",
    ms: 200,
    moves: true,
    still: "the playhead jumps; its cap shows a 1.2 s halo at the new place",
  },
};

/** The effective mode from the user's choice (or null) and the OS preference. */
function motionMode(choice, prefersReduced) {
  if (MOTION_MODES.includes(choice)) return choice;
  return prefersReduced ? "off" : "full";
}

/**
 * How cue `name` plays in `mode`: { animate, move, ms, still }. "subtle"
 * fades only (no movement) at 60 % of the length. While playing, nothing
 * animates (the playhead itself is drawn, not animated).
 */
function cueFor(name, mode, { playing = false } = {}) {
  const cue = CUES[name];
  if (!cue) return { animate: false, move: false, ms: 0, still: "" };
  if (mode === "off" || playing) return { animate: false, move: false, ms: 0, still: cue.still };
  if (mode === "subtle") {
    return { animate: true, move: false, ms: Math.round(cue.ms * 0.6), still: cue.still };
  }
  return { animate: true, move: cue.moves, ms: cue.ms, still: cue.still };
}

// -- ab-value.js (copy) --
// Default/custom A/B for one value (owner, 2026-10-18). Double-click a slider
// or numeric field (double-tap on touch, Shift+Enter with the keyboard) to
// flip between the default (0 dB, centre, 0 ms) and the last custom value;
// Alt+double-click resets and forgets. The remembered value is UI state: it
// lives in memory and is lost on reload. Each flip is one edit with the
// field's coalesce key, so flipping back and forth never piles up history.
// Spec: docs/design/GUI-DESIGN.md, "Default/custom toggle".

const EPSILON = 1e-4;
const same = (a, b) => Math.abs(a - b) < EPSILON;

/** Flip: custom -> default (remembering custom); default -> remembered. */
function toggleValue(value, fallback, stored) {
  if (!same(value, fallback)) return { value: fallback, stored: value, changed: true };
  if (stored === null || stored === undefined) return { value, stored: null, changed: false };
  return { value: stored, stored, changed: true };
}

/** Alt: back to the default, and forget the custom value. */
function resetValue(value, fallback) {
  return { value: fallback, stored: null, changed: !same(value, fallback) };
}

/** The remembered custom values, by field key (e.g. "clip-gain-<id>"). */
function createAbStore() {
  const values = new Map();
  return {
    get: (key) => (values.has(key) ? values.get(key) : null),
    set(key, value) {
      if (value === null) values.delete(key);
      else values.set(key, value);
    },
    toggle(key, value, fallback) {
      const result = toggleValue(value, fallback, this.get(key));
      this.set(key, result.stored);
      return result;
    },
    reset(key, value, fallback) {
      const result = resetValue(value, fallback);
      this.set(key, null);
      return result;
    },
  };
}

/** One store for the whole page: the remembered values are page state. */
const abValues = createAbStore();

/**
 * Wire a slider or numeric input: double-click / double-tap toggles,
 * Alt+double-click resets, Shift+Enter toggles from the keyboard. `read()`
 * gives the model value now, `write(value)` sends it (with the field's
 * coalesce key, so flips are one undo step each and never pile up),
 * `marker(stored)` shows or hides the remembered value on the control.
 */
function bindToggle(input, { key, fallback, read, write, marker }) {
  const act = (reset) => {
    const result = reset
      ? abValues.reset(key, read(), fallback)
      : abValues.toggle(key, read(), fallback);
    marker?.(abValues.get(key));
    if (result.changed) {
      write(result.value);
      return;
    }
    // Nothing to flip to: a brief flash says "noted, nothing stored".
    input.classList.remove("ab-flash");
    void input.offsetWidth;
    input.classList.add("ab-flash");
  };
  input.addEventListener("dblclick", (event) => {
    event.preventDefault();
    act(event.altKey);
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && event.shiftKey && !event.metaKey && !event.ctrlKey) {
      event.preventDefault();
      act(event.altKey);
    }
  });
  marker?.(abValues.get(key));
}

// -- help.js (copy) --
// Contextual help (WP48): pure helpers, no DOM and no imports, so the
// prototype embeds this file as-is (docs/design/sync-tokens.mjs) and
// `node --test` runs it.
//
// Help content is data: one Markdown file per topic and language under
// ui/help/<lang>/<id>.md, with front matter (id, title, applies-to, commands,
// related). ui/help/index.json lists the topic ids. The help panel
// (help-panel.js) asks `helpChain` what the user is looking at, picks the
// first topic that applies (`topicFor`), and renders its body with
// `renderHelpBody`, which fills in the live shortcuts, so a remapped key shows
// as remapped. GUI-DESIGN.md "Contextual help" has the whole design.

/** The command that opens help (F1 in keymap-default.js; "?" is the cheat sheet, help.keys). */
const HELP_COMMAND = "help.open";

/** What help can be about. A topic's `applies-to` names one or more of these. */
const HELP_TARGETS = [
  "timeline",
  "clip",
  "track",
  "bus",
  "transcript",
  "history",
  "candidates",
  "inspector",
  "palette",
  "empty",
  "error",
  "index",
];

const FRONT_LISTS = new Set(["applies-to", "commands", "related"]);

/**
 * "---\nid: clip\napplies-to: [clip]\n---\nBody" -> { id, title, appliesTo, commands, related, body }.
 * Lists are written [a, b]; missing lists are []. Throws on a file without front matter,
 * because a topic nobody can find is worse than a failing test.
 */
function parseTopic(text) {
  const match = String(text)
    .replace(/\r\n/g, "\n")
    .match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) throw new Error("help topic: no front matter");
  const meta = { "applies-to": [], commands: [], related: [] };
  for (const line of match[1].split("\n")) {
    const at = line.indexOf(":");
    if (at < 0 || !line.trim()) continue;
    const key = line.slice(0, at).trim();
    const raw = line.slice(at + 1).trim();
    meta[key] = FRONT_LISTS.has(key)
      ? raw
          .replace(/^\[|\]$/g, "")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean)
      : raw;
  }
  return {
    id: meta.id ?? "",
    title: meta.title ?? "",
    appliesTo: meta["applies-to"],
    commands: meta.commands,
    related: meta.related,
    body: match[2].trim(),
  };
}

/**
 * What the user is looking at, most specific first, ending in "timeline" and
 * "index" so there is always an answer. `context`: { control, palette, error,
 * empty, panel, inHeaders, selection (count), focusBus, focusTrack }.
 */
function helpChain(context = {}) {
  const chain = [];
  if (context.control) chain.push(context.control);
  if (context.palette) chain.push("palette");
  if (context.error) chain.push("error");
  if (context.empty) chain.push("empty");
  const object = () => {
    if (context.selection > 0) return "clip";
    if (context.focusBus) return "bus";
    if (context.focusTrack) return "track";
    return null;
  };
  const panel = context.panel ?? "timeline";
  if (context.inHeaders) chain.push(context.focusBus ? "bus" : "track");
  else if (panel === "timeline") {
    if (context.selection > 0) chain.push("clip");
    else if (context.focusBus) chain.push("bus");
  } else if (panel === "inspector") chain.push("inspector", object());
  else chain.push(panel);
  chain.push("timeline", "index");
  return [...new Set(chain.filter(Boolean))];
}

/** The first topic (from `topics`, any order) whose applies-to meets the chain; else null. */
function topicFor(chain, topics) {
  for (const target of chain) {
    const hit = topics.find((topic) => topic.appliesTo.includes(target));
    if (hit) return hit;
  }
  return null;
}

// -- shortcuts from the keymap ---------------------------------------------------------------------

/**
 * The shortcuts of one command, primary first, as the keymap data has them
 * ("Shift+Z", ["=", "+"]). `entries` is the keymap the user has right now
 * (keymap-config.js resolveKeymap: the defaults with their overrides), the same
 * data the cheat sheet, the palette and the menu bar read, so a remapped key
 * shows as remapped and a modifier alternate shows its own key. An unbound
 * command gives [].
 */
function shortcutsFor(command, entries) {
  return [
    ...new Set(entries.filter((entry) => entry.id === command).flatMap((entry) => entry.raw)),
  ];
}

/** The first topic (any order) that lists `command` under `commands`; else null. */
function topicForCommand(command, topics) {
  if (!command) return null;
  return topics.find((topic) => topic.commands.includes(command)) ?? null;
}

/** The catalog key of a command's name, as keymap-default.js labelKey has it. */
const commandLabelKey = (id) => `cmd.${id}`;

/** Message keys a command needs: a label (menus, palette) and a one-line hint. */
const commandKeys = (id) => [commandLabelKey(id), `cmd.${id}.hint`];

/** Commands that lack a label or hint in any catalog: [{ id, lang, key }]. Empty = no drift. */
function missingCommandText(ids, catalogs) {
  const missing = [];
  for (const id of ids)
    for (const [lang, catalog] of Object.entries(catalogs))
      for (const key of commandKeys(id))
        if (typeof catalog[key] !== "string" || !catalog[key].trim())
          missing.push({ id, lang, key });
  return missing;
}

// -- rendering ---------------------------------------------------------------------------------------

const escapeHtml = (text) =>
  String(text).replace(
    /[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
  );

/**
 * The inline marks a topic body may use, besides **bold** and `code`:
 *   {key:command.id}   the command's current shortcut(s), from the keymap
 *   {run:command.id}   a button that runs the command, labelled with its label
 *   {show:control-id}  "Show me": highlights the control (data-help-id) on screen
 *   [[topic-id]]       a link to another topic, labelled with its title
 *   [[topic-id|text]]  the same link with its own words (for grammar: "the track's [[bus|bus]]")
 */
const INLINE_MARKS = /\{(key|run|show):([\w.-]+)\}|\[\[([\w-]+)(?:\|([^\]]+))?\]\]/g;

function inline(text, ctx) {
  const parts = [];
  let last = 0;
  for (const m of text.matchAll(INLINE_MARKS)) {
    parts.push(plain(text.slice(last, m.index)));
    last = m.index + m[0].length;
    if (m[3]) {
      parts.push(
        `<a href="#help:${m[3]}" class="help-link" data-topic="${m[3]}">${escapeHtml(m[4] ?? ctx.title(m[3]))}</a>`,
      );
    } else if (m[1] === "key") {
      const keys = ctx.shortcuts(m[2]);
      parts.push(
        keys.length
          ? keys.map((k) => `<kbd>${escapeHtml(ctx.format(k))}</kbd>`).join(" ")
          : `<span class="help-nokey">${escapeHtml(ctx.t("ui.help.no_key"))}</span>`,
      );
    } else if (m[1] === "run") {
      parts.push(
        `<button type="button" class="button small help-run" data-run="${m[2]}">${escapeHtml(ctx.t(commandLabelKey(m[2])))}</button>`,
      );
    } else {
      parts.push(
        `<button type="button" class="button small help-show" data-show="${m[2]}">${escapeHtml(ctx.t("ui.help.show_me"))}</button>`,
      );
    }
  }
  parts.push(plain(text.slice(last)));
  return parts.join("");
}

function plain(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
}

/**
 * A topic body (a small Markdown subset: "## " headings, "- " lists, paragraphs)
 * as HTML. `ctx`: { t(key), shortcuts(command) -> ["Shift+Z"], format(combo)
 * -> "⇧Z", title(topicId) }. All text is escaped; nothing in a topic can inject markup.
 */
function renderHelpBody(body, ctx) {
  const out = [];
  let para = [];
  let items = null;
  const flush = () => {
    if (para.length) out.push(`<p>${inline(para.join(" "), ctx)}</p>`);
    if (items)
      out.push(`<ul>${items.map((item) => `<li>${inline(item, ctx)}</li>`).join("")}</ul>`);
    para = [];
    items = null;
  };
  for (const line of String(body).split("\n")) {
    if (!line.trim()) flush();
    else if (line.startsWith("## ")) {
      flush();
      out.push(`<h3>${inline(line.slice(3).trim(), ctx)}</h3>`);
    } else if (line.startsWith("- ")) {
      if (para.length) flush();
      items ??= [];
      items.push(line.slice(2).trim());
    } else if (items && /^\s/.test(line)) items[items.length - 1] += ` ${line.trim()}`;
    else {
      if (items) flush();
      para.push(line.trim());
    }
  }
  flush();
  return out.join("\n");
}

/** Every {key:}/{run:} command, {show:} control and [[link]] a body refers to. */
function topicRefs(body) {
  const refs = { commands: new Set(), controls: new Set(), topics: new Set() };
  for (const m of String(body).matchAll(INLINE_MARKS)) {
    if (m[3]) refs.topics.add(m[3]);
    else if (m[1] === "show") refs.controls.add(m[2]);
    else refs.commands.add(m[2]);
  }
  return refs;
}

// -- search ------------------------------------------------------------------------------------------

/** Lower case without accents, for matching only: "Äänitys" and "aanitys" meet. */
const fold = (text) => String(text).normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

/**
 * Rank `items` ({ id, title, text }) for `query`: every word must occur; a word
 * in the title counts 3, at the start of a title word 1 more, in the text 1.
 * Ties go by title. An empty query lists everything by title.
 */
function searchHelp(items, query) {
  const words = fold(query).split(/\s+/).filter(Boolean);
  const scored = [];
  for (const item of items) {
    const title = fold(item.title);
    const text = fold(item.text ?? "");
    let score = 0;
    let all = true;
    for (const word of words) {
      const inTitle = title.includes(word);
      const inText = text.includes(word);
      if (!inTitle && !inText) {
        all = false;
        break;
      }
      score += (inTitle ? 3 : 0) + (inText ? 1 : 0);
      if (new RegExp(`(^|\\s)${word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`).test(title)) score++;
    }
    if (all) scored.push({ item, score });
  }
  scored.sort((a, b) => b.score - a.score || a.item.title.localeCompare(b.item.title));
  return scored.map((s) => s.item);
}

// -- loading -----------------------------------------------------------------------------------------

/**
 * A cached loader: load(id, lang) -> topic. A topic missing in `lang` falls back
 * to English and says so (`fallback: true`), so a new topic can ship before its
 * translation without a blank panel. `fetchText(path)` returns the file's text.
 */
function createTopicLoader(fetchText) {
  const cache = new Map();
  const read = (path) => {
    if (!cache.has(path))
      cache.set(
        path,
        Promise.resolve().then(() => fetchText(path)),
      );
    return cache.get(path);
  };
  return {
    async index() {
      return JSON.parse(await read("help/index.json")).topics;
    },
    async load(id, lang) {
      try {
        return { ...parseTopic(await read(`help/${lang}/${id}.md`)), lang, fallback: false };
      } catch (error) {
        if (lang === "en") throw error;
        return { ...parseTopic(await read(`help/en/${id}.md`)), lang: "en", fallback: true };
      }
    },
  };
}

// -- help topics (copy) --
const HELP_FILES = {
 "en/timeline": "---\nid: timeline\ntitle: The timeline\napplies-to: [timeline]\ncommands: [transport.play, view.toggle, view.fit, view.fit_selection, view.zoom_in, view.zoom_out, view.back, view.wheel_mode, view.clip_words, panel.next, nav.home, spot, time.copy, help.open, help.keys]\nrelated: [clip, track, bus]\n---\nEvery track is a lane, and time runs left to right. A click anywhere in the lanes moves the play cursor there. A click on a clip also selects it; Shift+click adds or removes a clip. Drag across the lanes to mark a time range. While you drag, a hint on the lanes tells which key turns the range into the clips it touches (they are selected and the in and out marks go to their span) and which key cancels.\n\n## Listen\n- Play or stop: {key:transport.play}. Space always belongs to the timeline, whichever panel you are in.\n\n## Zoom and move\n- Close or wide view: {key:view.toggle} {show:view-toggle}\n- Zoom in or out: {key:view.zoom_in} or {key:view.zoom_out}\n- Show the whole edit: {key:view.fit}\n- Fit the selection or in-out range: {key:view.fit_selection}\n- Back to the view before: {key:view.back}\n\nDensity, waveform and follow settings are in the View menu. {show:view-menu} So are Fit tracks to the window and Keep tracks fitted to the window. To size one lane, drag the bottom edge of its header; double-click the edge to reset it.\n\nTwo-finger scrolling on a trackpad zooms the time axis around the pointer by default; sideways movement scrolls time, and up or down with the shift key held scrolls the lanes (the scrollbar and keys work too). A mouse wheel still scrolls, and scrolling with the command or control key held, like pinching, always zooms. Change it here: {run:view.wheel_mode}\n\nZoomed in far enough to read them, each speech clip writes its words under its name, so you see which word is where in the waveform. The word under the play cursor is brighter, and words you select in the transcript stand out. {run:view.clip_words}\n\n## Jump to a time\n- Click the big time in the corner to copy it to the clipboard; double-click it, or press {key:spot}, to type a time and jump there. Confirming the field jumps; leaving it cancels.\n- Type 1:23.5 (or 83,2) for that time, or start with + or - to move from the play cursor: +100 is 100 seconds on, -30 is 30 back, +1:30 is 90 on, +500ms is half a second. The result stays inside the edit.\n- The same works in the In, Out and Length rows: a time sets the mark, +2 or -2 moves it. Alt+click on a row copies its time.\n\n## Panels\n{key:panel.next} moves the keyboard to the next panel; {key:nav.home} brings it back here.\n\n## Help\n{key:help.open} opens help for what you are looking at; {key:help.keys} lists every key.\n\nSee also [[clip]] and [[track]].\n",
 "en/clip": "---\nid: clip\ntitle: A clip\napplies-to: [clip]\ncommands: [edit.split, edit.delete, edit.cut, edit.lift_cut, edit.close_gap_all, clip.mute, clip.fade, edit.undo]\nrelated: [timeline, track, transcript]\n---\nA clip is a stretch of one recording placed on a track. Several clips can come from the same recording; selecting one marks its siblings with a bracket.\n\n## Edit it\n- Split at the play cursor: {key:edit.split}\n- Delete: {key:edit.delete}. A soft cut: the audio goes quiet, the gap stays, and the Cuts list can restore it. The clipboard is untouched.\n- Cut: {key:edit.cut}. Copies to the clipboard and closes the gap on every track of the sync group.\n- Lift-cut: {key:edit.lift_cut}. Copies to the clipboard and soft-deletes in place: the gap stays and can be restored.\n- Close the gap on all tracks: {key:edit.close_gap_all}. Ripples the selection or in-out range out of every track; the clipboard is untouched.\n- Mute the clip: {key:clip.mute}. Muted clips are drawn faint and hatched.\n- Fade in and out: {key:clip.fade}\n\nEvery edit is one step back with {key:edit.undo}.\n\n## Look closer\nThe inspector shows the clip's level, sync and source. {show:inspector}\n\nSee also [[track]] and [[transcript]].\n",
 "en/track": "---\nid: track\ntitle: A track\napplies-to: [track]\ncommands: [track.mute, track.solo, rename]\nrelated: [bus, clip, timeline]\n---\nA track holds the clips of one voice or one kind of sound. Its header, on the left of the lane, names it and shows its colour; the controls appear when the track is current or under the pointer. {show:track-headers}\n\n- Mute or solo: {key:track.mute} and {key:track.solo}, or the M and S buttons.\n- Rename: {key:rename}\n- Level and pan: the header's sliders, or the inspector.\n- Move the current track with the arrow keys up and down.\n\nThe coloured pill is the speaker; the rail on the far left, if there is one, is the track's [[bus|bus]].\n",
 "en/bus": "---\nid: bus\ntitle: A bus\napplies-to: [bus]\ncommands: [bus.collapse, bus.expand, track.mute, track.solo]\nrelated: [track, timeline]\n---\nA bus groups tracks that are mixed together, such as all the voices or all the music. Its colour runs down the left edge of its tracks as a spine, and its letter badge (A, B …) appears wherever the bus is named.\n\n- Collapse the bus to one row: {key:bus.collapse}. A collapsed bus shows one thin ribbon per track, filled where that track has sound.\n- Expand it again: {key:bus.expand}\n- The bus's mute and solo act on every track in it; its fader sets the level of the whole bus.\n\nA bus with only one track is merged into that track's header. To put a track on a bus, use the bus picker in its header or the inspector.\n\nSee also [[track]].\n",
 "en/transcript": "---\nid: transcript\ntitle: The transcript\napplies-to: [transcript]\ncommands: [transport.play, edit.delete, edit.cut, nav.home]\nrelated: [clip, timeline]\n---\nThe transcript is the words of every speech track, in time order, with the speaker in the margin. It follows the play cursor, and the words being heard are underlined.\n\n- Select words with the mouse; the same stretch is selected on the timeline.\n- Delete the selected words: {key:edit.delete}. They are struck through and the gap stays.\n- Cut them: {key:edit.cut}. Before the cut, the transcript shows what else would go: words other speakers say in the same stretch.\n- {key:transport.play} still plays and stops; {key:nav.home} returns to the timeline.\n\nWords removed by a cut leave a small marker; the Cuts list can put them back. See also [[clip]].\n",
 "en/colab": "---\nid: colab\ntitle: Transcribing on Colab\napplies-to: [transcript]\ncommands: [app.transcribe, app.transcribe_colab, app.colab_settings]\nrelated: [transcript, track]\n---\nTranscription turns the speech into words you can read, search and cut by. It can run on this computer, or on Google Colab, which has a graphics card and is much faster on long recordings.\n\n- On this computer: Track, Transcribe, On this computer, or {key:app.transcribe}. The audio stays here.\n- On Colab: Track, Transcribe, On Colab (audio is uploaded to Google)…, or the second button in the empty transcript. **The audio is uploaded to Google.** The first time in a session kuulas says so and asks; \"Do not ask again\" remembers your answer. Nothing is uploaded until you press Upload and transcribe.\n- It uses the focused track's recordings, or every speech track's when no track is focused. All of them go in one run.\n- It runs in the background. The notice shows which recording the tool is on and its latest message; Cancel stops it. Your editing is not blocked.\n- The words arrive as one undo step per recording, like a local transcript. A transcript you changed while Colab worked is never overwritten: the run fails with a message and you start it again.\n\nThe program kuulas runs is `colab-transcribe` from your podcast project, started with `uvx` by default. Check it under Track, Transcribe, Colab transcription settings…: the command, the folder it runs in, extra arguments, the model, the language, and whether the audio is sent directly instead of through Google Drive (the default). A missing program, a failed run and an unreadable result each give a message that says which.\n\nTwo recordings with the same file name (without the ending) cannot go in one run, because the result is matched by that name; transcribe them one at a time. See also [[transcript]].\n",
 "en/history": "---\nid: history\ntitle: History\napplies-to: [history]\ncommands: [edit.undo, edit.redo]\nrelated: [clip, timeline]\n---\nHistory lists every edit since the project was made, newest at the bottom, with the time it happened. A line marks where each working session began and ended.\n\n- Undo and redo: {key:edit.undo} and {key:edit.redo}\n- Go back to any earlier step: select it in the list. Nothing is lost: the steps after it stay in the list and you can return to them.\n- Saved versions are pinned in the list.\n- Statistics: File, Statistics… (or the command palette) counts this session: the session's duration, each track's span, content, muted time and time without mutes, the clip lengths, who talked, the number of edits and the time spent editing. Copy it as text or save it as JSON. Undo is not recorded in the history, so it is not counted.\n\nUndo never touches the clipboard. See also [[timeline]].\n",
 "en/automix": "---\nid: automix\ntitle: Mixing with the automixer\napplies-to: []\ncommands: [export.automix]\nrelated: [track, timeline]\n---\nThe automixer mixes the finished edit for you: speech levelled and polished, music ducked under it, the whole thing at a target loudness. Kuulas hands it the edit as separate tracks, so you do not export or move any files yourself.\n\n- Start it from File, Export mix (automixer)…, or the command palette: {key:export.automix}\n- Set the target loudness, and optionally where an ad spot goes and how long it is.\n- It runs in the background. The notice shows the automixer's latest message; Cancel stops it.\n- The mix is saved next to the project's .kuulas folder (in the folder that holds it, never inside it), named after the edit and the time. The dialog can name another folder. Show in Finder opens the folder.\n\nOnly speech and music tracks are mixed. Buses are for your own monitoring balance and for burn-in exports to another app; the automixer does not use them, so they are left out of this job (the normal exports are unchanged). Track faders and pan are not applied either: the automixer levels the tracks and spreads the speakers itself. Clip gain and your edits are. Your recordings can be in any format and sample rate, since kuulas renders them for the automixer; the project itself must be 48000 Hz. The mix is a 16-bit WAV.\n\nThe first time, check the command under \"The automixer\" in the dialog. It is the program kuulas runs, normally `uv run automixer` in your podcast folder. A missing program gives a message that names it.\n\nTracks that are muted, or not soloed while another is, are left out, as in any export. See also [[track]].\n",
 "en/search": "---\nid: search\ntitle: Finding a command\napplies-to: [index]\ncommands: [help.search, palette.open]\nrelated: [timeline]\n---\nType what you want to do and kuulas shows the command, where it is in the menus and its key. Open **Help** and the cursor is already in the field \"Search commands and help…\" (or press {key:help.search}).\n\n- Search by the name, by a word from its description, or by what you would call it elsewhere: \"remove\" finds Delete, \"volume\" finds Gain, \"save as\" finds Export. English and Finnish names both work, whatever language kuulas is in.\n- The arrow keys choose a result and the confirm key runs it (the line under the results lists the keys). A greyed command stays in the list and says why it cannot run (for example, no project is open).\n- The \"Show in menu\" button, or its key shown under the results, opens the command's own menu and highlights it, so you learn where it lives.\n- Commands that are only in the command palette (the export for one format) say so. The palette ({key:palette.open}) searches the same way.\n- Help topics that match are listed below the commands; click one to read it.\n- In the desktop app the Help menu of the window's menu bar has \"Search commands…\", which opens the same search as a panel over the window.\n",
 "en/record": "---\nid: record\ntitle: Recording a take\napplies-to: [index]\ncommands: [transport.record, record.stop_mode]\nrelated: [track, timeline]\n---\nRecord one input channel onto a track: {key:transport.record} opens the record view. Choose the input, the channel and the track (or a new one), then press Record. The take starts where the playhead is and appears as a clip there when you stop.\n\n- kuulas plays nothing while it records. Listen through your audio interface's own direct monitoring.\n- Stopping takes two presses of Stop (or Space) by default: the first asks \"Stop recording?\", the second, within four seconds, stops. If you do not press again, the take simply goes on. You can choose one click or a 2-second hold instead: {key:record.stop_mode}, or the setting at the bottom of the record view.\n- Hiding the record view, closing the window or even a crash of the editor does not stop a take. A red \"Recording\" chip in the toolbar brings the view back; reopening the project shows it again.\n- The files are plain WAV files in the project's recordings folder, written so that everything up to the last second survives a crash or a pulled cable. A take that a crash interrupted is offered for import the next time you open the project; it is never imported without asking.\n- If the input is unplugged, the take waits for it and continues; the gap stays a gap on the timeline. Low disk space is announced at 30, 10 and 2 minutes left.\n\nOn a Mac the first recording asks for permission to use the microphone. When kuulas runs from a terminal, it is the terminal that needs the permission (System Settings, Privacy & Security, Microphone). Without it the input is silent: watch the level meter.\n\nSee also [[track]].\n",
 "fi/timeline": "---\nid: timeline\ntitle: Aikajana\napplies-to: [timeline]\ncommands: [transport.play, view.toggle, view.fit, view.fit_selection, view.zoom_in, view.zoom_out, view.back, view.wheel_mode, view.clip_words, panel.next, nav.home, spot, time.copy, help.open, help.keys]\nrelated: [clip, track, bus]\n---\nJokainen raita on oma kaistansa, ja aika kulkee vasemmalta oikealle. Napsautus missä tahansa kaistoilla siirtää toistokohdan siihen. Napsautus leikkeeseen myös valitsee sen; vaihto+napsautus lisää leikkeen valintaan tai poistaa sen. Vetämällä kaistoilla merkitset aikavälin. Vedon aikana kaistoilla näkyvä vihje kertoo, mikä näppäin muuttaa välin sen koskettamiksi leikkeiksi (ne valitaan ja sisään- ja ulosmerkit siirtyvät niiden ylle) ja mikä peruu vedon.\n\n## Kuuntele\n- Toista tai pysäytä: {key:transport.play}. Välilyönti kuuluu aina aikajanalle, missä paneelissa oletkin.\n\n## Zoomaa ja liiku\n- Lähi- tai laajanäkymä: {key:view.toggle} {show:view-toggle}\n- Lähennä tai loitonna: {key:view.zoom_in} tai {key:view.zoom_out}\n- Näytä koko versio: {key:view.fit}\n- Sovita valintaan tai alku–loppuvälille: {key:view.fit_selection}\n- Takaisin edelliseen näkymään: {key:view.back}\n\nTiheys, aaltomuoto ja seuranta ovat Näkymä-valikossa. {show:view-menu} Samoin Sovita raidat ikkunaan ja Pidä raidat sovitettuina ikkunaan. Yhden kaistan korkeutta säädät vetämällä sen otsikon alareunaa; kaksoisnapsautus palauttaa sen.\n\nKahden sormen vieritys ohjauslevyllä zoomaa aika-akselia osoittimen kohdalta oletuksena; sivuttain liikkuminen vierittää aikaa, ja ylös tai alas vaihtonäppäin pohjassa vierittää raitoja (myös vierityspalkki ja näppäimet toimivat). Hiiren rulla vierittää edelleen, ja vieritys komento- tai control-näppäin pohjassa sekä nipistys zoomaavat aina. Vaihda tästä: {run:view.wheel_mode}\n\nKun lähennys on tarpeeksi suuri sanojen lukemiseen, jokainen puheleike kirjoittaa sanansa nimensä alle, joten näet, missä aaltomuodon kohdassa mikin sana on. Toistokohdan alla oleva sana on kirkkaampi, ja litteraatiosta valitut sanat erottuvat. {run:view.clip_words}\n\n## Hyppää aikaan\n- Napsauta nurkan isoa aikaa kopioidaksesi sen leikepöydälle; kaksoisnapsauta sitä tai paina {key:spot}, niin voit kirjoittaa ajan ja hypätä siihen. Vahvistus hyppää; kentästä poistuminen peruu.\n- Kirjoita 1:23,5 (tai 83,2) tietylle ajalle, tai aloita merkillä + tai - siirtyäksesi toistokohdasta: +100 on 100 sekuntia eteenpäin, -30 on 30 taaksepäin, +1:30 on 90 eteenpäin, +500ms on puoli sekuntia. Tulos pysyy muokkauksen sisällä.\n- Sama toimii Alku-, Loppu- ja Pituus-riveillä: aika asettaa merkin, +2 tai -2 siirtää sitä. Alt+napsautus rivillä kopioi sen ajan.\n\n## Paneelit\n{key:panel.next} siirtää näppäimistön seuraavaan paneeliin; {key:nav.home} tuo sen takaisin tänne.\n\n## Ohje\n{key:help.open} avaa ohjeen siihen, mitä katsot; {key:help.keys} listaa kaikki näppäimet.\n\nKatso myös [[clip]] ja [[track]].\n",
 "fi/clip": "---\nid: clip\ntitle: Leike\napplies-to: [clip]\ncommands: [edit.split, edit.delete, edit.cut, edit.lift_cut, edit.close_gap_all, clip.mute, clip.fade, edit.undo]\nrelated: [timeline, track, transcript]\n---\nLeike on pala yhdestä äänityksestä raidalla. Samasta äänityksestä voi olla monta leikettä; kun valitset yhden, sen sisarleikkeet merkitään hakasella.\n\n## Muokkaa\n- Jaa toistokohdasta: {key:edit.split}\n- Poista: {key:edit.delete}. Pehmeä leikkaus: ääni hiljenee, väli jää ja leikkauslistalta sen voi palauttaa. Leikepöytä ei muutu.\n- Leikkaa: {key:edit.cut}. Kopioi leikepöydälle ja sulkee välin tahdistusryhmän jokaiselta raidalta.\n- Nosta: {key:edit.lift_cut}. Kopioi leikepöydälle ja poistaa pehmeästi paikallaan: väli jää ja sen voi palauttaa.\n- Sulje aukko kaikilta raidoilta: {key:edit.close_gap_all}. Poistaa valinnan tai merkityn välin jokaiselta raidalta ja sulkee aukon; leikepöytä ei muutu.\n- Mykistä leike: {key:clip.mute}. Mykistetty leike on haalea ja viivoitettu.\n- Häivytys sisään ja ulos: {key:clip.fade}\n\nJokaisen muokkauksen voi perua askel kerrallaan: {key:edit.undo}.\n\n## Katso tarkemmin\nTarkastimessa näkyvät leikkeen taso, tahdistus ja lähde. {show:inspector}\n\nKatso myös [[track]] ja [[transcript]].\n",
 "fi/track": "---\nid: track\ntitle: Raita\napplies-to: [track]\ncommands: [track.mute, track.solo, rename]\nrelated: [bus, clip, timeline]\n---\nRaidalla ovat yhden äänen tai yhdenlaisen äänen leikkeet. Kaistan vasemmalla puolella oleva otsake nimeää raidan ja näyttää sen värin; säätimet tulevat esiin, kun raita on valittuna tai osoitin on sen päällä. {show:track-headers}\n\n- Mykistä tai soolaa: {key:track.mute} ja {key:track.solo}, tai M- ja S-painikkeet.\n- Nimeä uudelleen: {key:rename}\n- Taso ja panorointi: otsakkeen liukusäätimet tai tarkastin.\n- Valitse raita nuolinäppäimillä ylös ja alas.\n\nVärillinen tappi on puhuja; vasemman reunan kisko, jos sellainen on, on raidan [[bus|väylä]].\n",
 "fi/bus": "---\nid: bus\ntitle: Väylä\napplies-to: [bus]\ncommands: [bus.collapse, bus.expand, track.mute, track.solo]\nrelated: [track, timeline]\n---\nVäylä kokoaa yhteen raidat, jotka miksataan yhdessä, esimerkiksi kaikki äänet tai kaikki musiikki. Sen väri kulkee raitojen vasemmassa reunassa selkärankana, ja sen kirjaintunnus (A, B …) näkyy kaikkialla, missä väylä mainitaan.\n\n- Supista väylä yhdeksi riviksi: {key:bus.collapse}. Supistetussa väylässä on jokaiselle raidalle ohut nauha, joka on täytetty siltä osin kuin raidalla on ääntä.\n- Laajenna takaisin: {key:bus.expand}\n- Väylän mykistys ja soolo koskevat kaikkia sen raitoja; sen liukusäädin asettaa koko väylän tason.\n\nVäylä, jossa on vain yksi raita, yhdistyy raidan otsakkeeseen. Raidan saa väylälle otsakkeen väylävalitsimesta tai tarkastimesta.\n\nKatso myös [[track]].\n",
 "fi/transcript": "---\nid: transcript\ntitle: Litteraatti\napplies-to: [transcript]\ncommands: [transport.play, edit.delete, edit.cut, nav.home]\nrelated: [clip, timeline]\n---\nLitteraatti on kaikkien puheraitojen sanat aikajärjestyksessä, puhuja reunassa. Se seuraa toistokohtaa, ja kuultavat sanat on alleviivattu.\n\n- Valitse sanoja hiirellä; sama kohta valitaan myös aikajanalla.\n- Poista valitut sanat: {key:edit.delete}. Ne yliviivataan ja väli jää.\n- Leikkaa ne: {key:edit.cut}. Ennen leikkausta litteraatti näyttää, mitä muuta lähtisi: muiden puhujien sanat samalta kohdalta.\n- {key:transport.play} toistaa ja pysäyttää edelleen; {key:nav.home} palaa aikajanalle.\n\nLeikkauksen poistamista sanoista jää pieni merkki; leikkauslistalta ne saa takaisin. Katso myös [[clip]].\n",
 "fi/colab": "---\nid: colab\ntitle: Litterointi Colabissa\napplies-to: [transcript]\ncommands: [app.transcribe, app.transcribe_colab, app.colab_settings]\nrelated: [transcript, track]\n---\nLitteroinnissa puhe muuttuu sanoiksi, joita voi lukea, hakea ja joiden mukaan voi leikata. Se voi toimia tällä tietokoneella tai Google Colabissa, jossa on näytönohjain ja joka on pitkillä äänitteillä paljon nopeampi.\n\n- Tällä tietokoneella: Raita, Litteroi, Litteroi raita tällä tietokoneella, tai {key:app.transcribe}. Ääni pysyy täällä.\n- Colabissa: Raita, Litteroi, Litteroi raita Colabissa (ääni lähetetään Googlelle)…, tai tyhjän litteraatin toinen painike. **Ääni lähetetään Googlelle.** Istunnon ensimmäisellä kerralla kuulas kertoo sen ja kysyy; \"Älä kysy uudelleen\" muistaa vastauksesi. Mitään ei lähetetä ennen kuin painat Lähetä ja litteroi.\n- Mukaan tulevat kohdistetun raidan äänitteet tai kaikkien puheraitojen äänitteet, jos mitään raitaa ei ole kohdistettu. Kaikki lähtevät yhdellä ajolla.\n- Ajo tapahtuu taustalla. Ilmoitus näyttää, mitä äänitettä työkalu käsittelee, ja sen viimeisimmän viestin; Peruuta pysäyttää sen. Muokkaus ei esty.\n- Sanat tulevat yhtenä kumoamisaskeleena äänitettä kohti, kuten paikallinen litteraatti. Colabin työskennellessä muuttamaasi litteraattia ei koskaan korvata: ajo päättyy viestiin ja sen voi aloittaa uudelleen.\n\nKuulaksen ajama ohjelma on podcast-projektisi `colab-transcribe`, oletuksena `uvx`:llä käynnistettynä. Tarkista se kohdasta Raita, Litteroi, Colab-litteroinnin asetukset…: komento, kansio jossa se ajetaan, lisäargumentit, malli, kieli ja se, lähetetäänkö ääni suoraan Google Driven kautta kulkemisen sijaan (oletus). Puuttuva ohjelma, epäonnistunut ajo ja lukukelvoton tulos antavat kukin viestin, joka kertoo mistä on kyse.\n\nKahta samannimistä äänitettä (päätettä lukuun ottamatta) ei voi litteroida samalla ajolla, koska tulos tunnistetaan nimestä; litteroi ne yksi kerrallaan. Katso myös [[transcript]].\n",
 "fi/history": "---\nid: history\ntitle: Historia\napplies-to: [history]\ncommands: [edit.undo, edit.redo]\nrelated: [clip, timeline]\n---\nHistoriassa on jokainen muokkaus projektin alusta asti, uusin alimpana, tekoaikoineen. Viiva merkitsee, missä kukin työskentelykerta alkoi ja päättyi.\n\n- Kumoa ja tee uudelleen: {key:edit.undo} ja {key:edit.redo}\n- Palaa mihin tahansa aiempaan vaiheeseen: valitse se listasta. Mitään ei menetetä: sen jälkeiset vaiheet jäävät listaan, ja niihin voi palata.\n- Tilastot: Tiedosto, Tilastot… (tai komentopaletti) laskee tämän istunnon: istunnon keston, jokaisen raidan jänteen, sisällön, mykistetyn ajan ja ajan ilman mykistyksiä, leikkeiden pituudet, kuka puhui, muokkausten määrän ja muokkaukseen käytetyn ajan. Voit kopioida ne tekstinä tai tallentaa JSON-tiedostona. Kumoamista ei tallenneta historiaan, joten sitä ei lasketa.\n\nKumoaminen ei koske leikepöytää. Katso myös [[timeline]].\n",
 "fi/automix": "---\nid: automix\ntitle: Miksaus automixerilla\napplies-to: []\ncommands: [export.automix]\nrelated: [track, timeline]\n---\nAutomixer miksaa valmiin leikkauksen puolestasi: puhe tasataan ja viimeistellään, musiikki painuu puheen alle ja kokonaisuus saatetaan tavoiteäänekkyyteen. Kuulas antaa sille leikkauksen erillisinä raitoina, joten et vie tai siirrä tiedostoja itse.\n\n- Käynnistä Tiedosto-valikosta Vie miksaus (automixer)… tai komentopaletista: {key:export.automix}\n- Aseta tavoiteäänekkyys ja halutessasi mainoskohta ja mainoksen pituus.\n- Miksaus ajetaan taustalla. Ilmoitus näyttää automixerin viimeisimmän viestin; Peruuta pysäyttää sen.\n- Miksaus tallentuu projektin .kuulas-kansion viereen (kansioon, jossa se on, ei koskaan sen sisään), nimenä leikkaus ja kellonaika. Dialogissa voi valita toisen kansion. Näytä Finderissä avaa kansion.\n\nMiksataan vain puhe- ja musiikkiraidat. Väylät ovat oman kuunteluvalvontasi tasapainoa ja toiseen sovellukseen vietäviä kiinteitä vientejä varten; automixer ei käytä niitä, joten ne jätetään tästä ajosta pois (tavalliset viennit eivät muutu). Raitojen liukusäätimiä ja panorointia ei myöskään käytetä: automixer tasaa raidat ja levittää puhujat itse. Leikkeen vahvistus ja leikkauksesi otetaan huomioon. Äänitteet voivat olla missä tahansa muodossa ja näytteenottotaajuudella, koska kuulas renderöi ne automixerille; itse projektin on oltava 48000 Hz. Miksaus on 16-bittinen WAV.\n\nTarkista ensimmäisellä kerralla komento dialogin kohdasta Automixer. Se on ohjelma, jonka kuulas ajaa, yleensä `uv run automixer` podcast-kansiossasi. Jos ohjelmaa ei löydy, viesti kertoo sen nimen.\n\nMykistetyt raidat ja raidat, joita ei ole soolotettu toisen ollessa soolossa, jätetään pois kuten missä tahansa viennissä. Katso myös [[track]].\n",
 "fi/search": "---\nid: search\ntitle: Komennon etsiminen\napplies-to: [index]\ncommands: [help.search, palette.open]\nrelated: [timeline]\n---\nKirjoita, mitä haluat tehdä, niin kuulas näyttää komennon, sen paikan valikoissa ja sen näppäimen. Avaa **Ohje**, niin kursori on jo kentässä \"Hae komentoja ja ohjetta…\" (tai paina {key:help.search}).\n\n- Hae nimellä, sanalla kuvauksesta tai nimellä, jota käyttäisit muualla: \"remove\" löytää Poista-komennon, \"volume\" voimakkuuden ja \"tallenna nimellä\" viennin. Sekä suomenkieliset että englanninkieliset nimet toimivat kuulaksen kielestä riippumatta.\n- Nuolinäppäimet valitsevat tuloksen ja vahvistusnäppäin suorittaa sen (tulosten alla oleva rivi luettelee näppäimet). Harmaa komento pysyy listassa ja kertoo, miksi sitä ei voi nyt suorittaa (esimerkiksi projektia ei ole avattu).\n- \"Näytä valikossa\" -painike tai sen tulosten alla näkyvä näppäin avaa komennon oman valikon ja korostaa sen, jotta opit, missä se on.\n- Komennot, jotka ovat vain komentopaletissa (yhden tiedostomuodon vienti), kertovat \"Vain komentopaletissa\". Paletti ({key:palette.open}) hakee samalla tavalla.\n- Osuvat ohjeaiheet näkyvät komentojen alla; avaa aihe napsauttamalla.\n- Työpöytäsovelluksessa ikkunan valikkorivin Ohje-valikossa on \"Hae komentoja…\", joka avaa saman haun paneelina ikkunan päälle.\n",
 "fi/record": "---\nid: record\ntitle: Oton äänittäminen\napplies-to: [index]\ncommands: [transport.record, record.stop_mode]\nrelated: [track, timeline]\n---\nÄänitä yksi tulon kanava raidalle: {key:transport.record} avaa äänitysnäkymän. Valitse tulo, kanava ja raita (tai uusi raita) ja paina Äänitä. Otto alkaa toistokohdasta ja ilmestyy siihen leikkeenä, kun pysäytät.\n\n- kuulas ei soita mitään äänittäessään. Kuuntele äänikortin omasta suoramonitoroinnista.\n- Pysäyttäminen vaatii oletuksena kaksi painallusta Pysäytä-painikkeesta (tai välilyönnistä): ensimmäinen kysyy \"Pysäytetäänkö äänitys?\", toinen neljän sekunnin sisällä pysäyttää. Jos et paina uudelleen, äänitys vain jatkuu. Voit valita sen sijaan yhden painalluksen tai 2 sekunnin painalluksen: {key:record.stop_mode} tai asetus äänitysnäkymän alaosassa.\n- Äänitysnäkymän piilottaminen, ikkunan sulkeminen tai edes editorin kaatuminen ei pysäytä ottoa. Työkalupalkin punainen \"Äänitetään\"-merkki tuo näkymän takaisin, ja projektin avaaminen uudelleen näyttää sen.\n- Tiedostot ovat tavallisia WAV-tiedostoja projektin äänityskansiossa, ja ne kirjoitetaan niin, että kaikki viimeiseen sekuntiin asti säilyy kaatumisen tai irronneen johdon jälkeen. Kaatumisen keskeyttämä otto tarjotaan tuotavaksi, kun avaat projektin seuraavan kerran; sitä ei koskaan tuoda kysymättä.\n- Jos tulo irrotetaan, otto odottaa sitä ja jatkuu; aukko jää aikajanalle aukoksi. Vähäisestä levytilasta kerrotaan, kun jäljellä on 30, 10 ja 2 minuuttia.\n\nMacissa ensimmäinen äänitys kysyy lupaa käyttää mikrofonia. Kun kuulas ajetaan päätteestä, lupa tarvitaan päätteelle (Järjestelmäasetukset, Tietosuoja ja suojaus, Mikrofoni). Ilman lupaa tulo on hiljainen: seuraa tasomittaria.\n\nKatso myös [[track]].\n",

        const on = lane.speech.some(([s0, s1]) => t >= s0 && t < s1);
        const amp = kind === "gate" ? 0 : on ? (i === 2 ? 0.3 + 0.25 * r() : 0.3 + 0.6 * r()) : 0.04 * r();

    const a = X(st.range[0]), b = X(st.range[1]), y0 = st.range[2] ? 16 + laneH * st.range[2] : 14, hh = st.range[2] ? laneH : laneH * 2 + 2;

  }

const PROTO_KEYMAP = [

  ["view.zoom_out", "-"], ["view.back", "Alt+Z"], ["view.forward", "Shift+Alt+Z"], ["panel.next", "F6"], ["panel.previous", "Shift+F6"], ["nav.home", "Escape"],
  ["edit.split", "B"], ["edit.split", "Mod+B"], ["edit.delete", "Backspace"], ["edit.cut", "X"], ["edit.cut", "Mod+X"],
  ["clip.mute", "N"], ["clip.mute", "Alt+Mod+M"], ["clip.fade", "G"], ["edit.undo", "Mod+Z"], ["edit.redo", "Shift+Mod+Z"],

  ["help.open", "F1"], ["help.keys", "?"],

const PROTO_KEYNAMES = { Mod: "⌘", Alt: "⌥", Shift: "⇧", Backspace: "⌫", Escape: "Esc", Enter: "↩", ArrowLeft: "←", ArrowRight: "→" };

  const keys = shortcut === "+" ? ["+"] : shortcut.split("+");

function nestRows(collapsed) {
  const H = px("--lane-h"), BUS_H = px("--bus-h"), GAP = px("--group-gap"), rows = [];

  const members = (id) => NEST.tracks.filter((t) => t.bus === id);
  const walk = (bus, depth, chain) => {
    const m = members(bus.id), sub = kids(bus.id);
    if (m.length === 1 && sub.length === 0) { // one-track bus: merged into its track
      rows.push({ kind: "track", t: m[0], bus, depth, chain: [...chain, bus], merged: true, y, h: H }); y += H; return;
    }

    if (isCollapsed) return;

function drawNested(rows) {

      if (r.collapsed) { const m = NEST.tracks.filter((t) => t.bus === r.bus.id); const lay = ribbonLayout(m.length); if (r.bus.id === "int2") ctx.globalAlpha = P.numbers.mutedOpacity; m.forEach((t, i) => { ctx.fillStyle = P.hue(t.hue).wave; for (let p = 0; p < w; p++) { const tt = v0 + p / pps; if (peak(t.src, tt + (t.shift ?? 0), tt + (t.shift ?? 0) + 1 / pps) > 0.08) ctx.fillRect(p, r.y + 4 + i * lay.strip, 1, lay.strip - 2); } }); ctx.globalAlpha = 1; }

}

function countControls() {
  // The density budget: visible, focusable controls in the window at rest.
  // Visible = really on screen: the element (or its child) is what a click at its centre would hit.
