[project]
name = "kuulas"
version = "26.10.23.1"
description = "Multitrack spoken-word DAW: transcript editing, buses, the speechmix pipeline"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # The podcast repo's shared pipeline, imported rather than reimplemented.
    # A path dependency for now: see ROADMAP.md ("speechmix as a package").
    "speechmix",
    # Hindenburg sessions and the speech-activity rules built on speechmix.
    "nhsx",
    # Auto-Silence values learned from the clips the user muted by hand (shared with
    # podcast-magic and colab-transcribe: one rule, not a copy). Stdlib only.
    "silencelearn",
    "numpy>=2.4.2",
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
    # /api/live (the editor window's position and change feed) is a WebSocket.
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sounddevice>=0.5.2",
    "soundfile>=0.14.0",
    # Streaming resampler, for an output device that cannot run the project
    # rate (WP2). Playback only; export stays at the project rate.
    "soxr>=1.1.0",
]

[project.optional-dependencies]
# Local transcription. Cross-platform (CPU int8 everywhere, CUDA where present).
# faster-whisper 1.2.1 calls av.open(..., metadata_errors="ignore"), which av 19
# removed; stay below 19 until faster-whisper supports it.
transcribe = ["faster-whisper>=1.2.0", "av<19"]
# The native window (WP15): system web view, native file dialogs and menu.
# Not in the base dependencies: Linux needs system WebKit packages for it.
desktop = ["pywebview>=5"]

[project.scripts]
kuulas = "kuulas.cli:main"
# The standalone recorder (WP12a, docs/RECORDER.md): its own process, never the editor.
kuulas-recorder = "kuulas_recorder.cli:main"
# The detached transcription worker (WP79): started by the editor, outlives it.
kuulas-worker = "kuulas.transcribe_worker:main"

[tool.uv.sources]
speechmix = { path = "../podcast/packages/speechmix", editable = true }
nhsx = { path = "../podcast/packages/nhsx", editable = true }
silencelearn = { path = "../podcast/packages/silencelearn", editable = true }

[dependency-groups]
dev = ["ruff==0.15.8", "pytest>=9.0.2", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# kuulas_recorder imports nothing from kuulas (tests/test_recorder_isolation.py).
packages = ["src/kuulas", "src/kuulas_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/hardware and tests/manual are run by hand
# (uv run pytest tests/hardware; uv run pytest tests/manual); a path given on the
# command line is still collected. The rest is pytest's default list, which this
# setting replaces.
norecursedirs = ["hardware", "manual", "*.egg", ".*", "_darcs", "build", "CVS", "dist",
                 "node_modules", "venv", "{arch}"]
markers = ["slow: minutes of CPU and GB of disk; lives in tests/manual, run by hand"]

[tool.ruff]
line-length = 90
# Agent worktrees are other checkouts of this repo, not part of it.
extend-exclude = [".claude"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "SIM", "RET", "ARG", "PIE", "PERF",
    "UP", "RUF", "PL", "PT", "S", "BLE", "DTZ", "ASYNC", "TRY", "N",
]
ignore = [
    # Mixer and op functions take many keyword parameters by design.
    "PLR0913", "PLR0912", "PLR0915", "PLR2004",
    # Exception messages are short and contextual; a class per message is noise.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
# faster-whisper is an optional extra (`uv sync --extra transcribe`); importing
# it inside local() keeps the base install from pulling it in.
"src/kuulas/transcribe.py" = ["PLC0415"]
