name: desktop-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/desktop-smoke.yml
      - pyproject.toml
      - src/kuulas/desktop.py
      - tests/test_desktop.py

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: desktop-smoke (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuulas
    steps:
      - uses: actions/checkout@v7
        with:
          path: kuulas
      - uses: actions/checkout@v7
        with:
          repository: ollisulopuisto/podcast
          path: podcast
      - uses: astral-sh/setup-uv@v7
      # Exercise pywebview's GTK/WebKit backend on Linux. The test does not open
      # a window, so a display server is unnecessary.
      - name: System web view packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          libcairo2-dev libgirepository1.0-dev pkg-config
          ffmpeg libportaudio2 libsndfile1
      - run: uv sync --extra desktop
      - name: pywebview imports
        run: uv run python -c "import webview; print(webview.__file__)"
      - name: pure desktop tests (no window)
        run: uv run pytest -q tests/test_desktop.py tests/test_messages.py
