name: dmg

# Builds the Developer ID signed tester .dmg of Kuulas (WP73) on a GitHub-hosted Apple-silicon Mac.
#   - by hand: Actions > dmg > Run workflow (the .dmg is a downloadable artifact, 30 days);
#   - on a version tag (v26.10.19.23 ...): the same build, attached to a GitHub Release
#     (the repository is public: anyone can download the release).
# Signed with the repository's Developer ID certificate. Not notarised until Apple
# notarization credentials are configured; Gatekeeper may still require right-click > Open.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the release step needs it; nothing else is written

jobs:
  dmg:
    name: build the .dmg (macOS, Apple silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: kuulas
      # speechmix, nhsx, silencelearn and the automixer come from the podcast repo (public): wheels built from a
      # clean checkout of main (build_wheels.sh reads PODCAST_SRC, never edits it).
      - uses: actions/checkout@v7
        with:
          repository: ollisulopuisto/podcast
          ref: 45c5c2b927a2f4fb8c3c40108f7379bf185c0bab
          path: podcast
          # The pinned tree has .Jules/.jules notes that collide on macOS.
          # Keep every build source while excluding those unrelated directories.
          sparse-checkout: |
            packages
            apps
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/kuulas-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
      # ffmpeg comes from a third-party host that was down for hours on 2026-10-21 (521) and
      # failed the build. fetch_ffmpeg.sh keeps a copy of the last good download in this
      # cache folder and uses it when the download fails; a fresh download is saved below.
      - name: Restore the cached ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-macos-arm64-${{ github.run_id }}
          restore-keys: ffmpeg-macos-arm64-
      - name: Build the .dmg
        working-directory: kuulas
        env:
          PODCAST_SRC: ${{ github.workspace }}/podcast
          KUULAS_FFMPEG_CACHE: ${{ runner.temp }}/ffmpeg-cache
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          rm -f "$KUULAS_FFMPEG_CACHE/.fresh"
          scripts/build_dmg.sh --out "$RUNNER_TEMP/dist"
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/kuulas-signing.keychain-db" || true
      - name: Was ffmpeg freshly downloaded?
        id: ffmpeg
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ffmpeg-cache/.fresh" ]; then echo "fresh=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the fresh ffmpeg for the next build
        if: always() && steps.ffmpeg.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-macos-arm64-${{ github.run_id }}
      - name: What was built
        run: |
          ls -la "$RUNNER_TEMP/dist"
          shasum -a 256 "$RUNNER_TEMP/dist"/*.dmg | tee "$RUNNER_TEMP/dist/SHA256.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: Kuulas-dmg
          path: ${{ runner.temp }}/dist/*
          retention-days: 30
      - name: Attach to the GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "Kuulas ${GITHUB_REF_NAME}" \
            --notes "Unsigned test build for Apple-silicon Macs. First open: right-click, Open. See docs/TESTERS.md. Checksums in SHA256.txt." \
            "$RUNNER_TEMP"/dist/*.dmg "$RUNNER_TEMP"/dist/SHA256.txt
