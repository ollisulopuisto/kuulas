name: ci

on:
  push:
    branches: [main]
  pull_request:

# kuulas imports speechmix and nhsx from the podcast repo as path dependencies
# (../podcast/packages/...), so both repos are checked out side by side:
#   $GITHUB_WORKSPACE/kuulas and $GITHUB_WORKSPACE/podcast.
# The podcast repo is public, so no token is needed to read it.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is off for now (owner, 2026-10-26): its Biome check fails on every file
        # (CRLF checkout) and it is red on main too. Add windows-latest back to turn it on;
        # the Windows-only steps below are kept and skip themselves.
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: kuulas
    steps:
      - uses: actions/checkout@v7
        with:
          path: kuulas
      - uses: actions/checkout@v7
        with:
          repository: ollisulopuisto/podcast
          path: podcast
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Audio decoding and the export tests need ffmpeg and libsndfile/PortAudio.
      - name: ffmpeg and audio libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg and audio libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 libsndfile1
      - name: ffmpeg and tzdata (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync
      - run: uv run ruff check .
      - name: Python tests (Windows editor coverage; omit platform-only integration)
        if: runner.os == 'Windows'
        run: >
          uv run pytest -q -vv --full-trace -o faulthandler_timeout=10
          --ignore-glob=tests/test_recorder_*.py
          --ignore-glob=tests/test_record_*.py
          --ignore=tests/test_analysis_worker.py
          --ignore=tests/test_background_transcribe.py
          --ignore=tests/test_build_script.py
          --ignore-glob=tests/test_automix*.py
          --ignore=tests/test_fetch_ffmpeg.py
          --ignore=tests/test_keys_doc.py
          --ignore=tests/test_memory_ceiling.py
          --ignore=tests/test_stage_bundle.py
          --ignore=tests/test_toolpath.py
          --ignore=tests/test_transcribe_worker.py
          --ignore=tests/test_worker_manager.py
          --deselect=tests/test_colab_session.py::test_cancel_stops_the_tool_and_stores_nothing
          --deselect=tests/test_colab_transcribe.py::test_cancel_stops_the_process_and_removes_the_folder
          --deselect=tests/test_colab_transcribe.py::test_cancel_asks_the_tool_to_stop_its_colab_session_with_sigint_first
          --deselect=tests/test_cut_preview.py::test_session_cut_preview_lock_duration_measurement
          --deselect=tests/test_export_all_tracks.py::test_bridge_reveals_only_the_last_automixer_log
          --deselect=tests/test_fuzz_hardening.py::test_desktop_bridge_hardening
          --deselect=tests/test_import_hardening.py::test_a_hung_ffprobe_is_killed_and_reported
          --deselect=tests/test_import_hardening.py::test_a_hung_ffmpeg_is_killed_and_reported
          --deselect=tests/test_import_hardening.py::test_a_decoder_that_loses_its_source_reports_the_drive
          --deselect=tests/test_media.py::test_a_linked_file_that_vanishes_after_open_plays_silence_after_a_check
          --deselect=tests/test_offload_no_inline.py::test_a_signal_death_names_the_signal
          --deselect=tests/test_source_map_api.py::test_session_source_map_lock_duration_measurement
          --deselect=tests/test_worker_launch.py::test_the_worker_runs_when_the_executable_is_the_bundles_launcher
      - name: Python tests
        if: runner.os != 'Windows'
        run: uv run pytest -q
      - run: node --test ui/tests/*.test.js
      - run: npx --yes @biomejs/biome@2.2.4 check ui/

  desktop-smoke:
    name: desktop-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is off for now (owner, 2026-10-26): its Biome check fails on every file
        # (CRLF checkout) and it is red on main too. Add windows-latest back to turn it on;
        # the Windows-only steps below are kept and skip themselves.
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: kuulas
    steps:
      - uses: actions/checkout@v7
        with:
          path: kuulas
      - uses: actions/checkout@v7
        with:
          repository: ollisulopuisto/podcast
          path: podcast
      - uses: astral-sh/setup-uv@v7
      # Linux: pywebview's GTK backend. Chosen over Qt because it is a few small
      # distro packages (python3-gi, WebKit2GTK 4.1), where Qt is ~200 MB of
      # PyQt wheels; WebKit2GTK is also the engine most Linux desktops ship.
      # 4.1 is the libsoup3 build that Ubuntu 22.04+ carries. The window is
      # never opened in CI, so no display server is needed.
      - name: System web view packages (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          libcairo2-dev libgirepository1.0-dev pkg-config
          ffmpeg libportaudio2 libsndfile1
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --extra desktop
      - name: pywebview imports
        run: uv run python -c "import webview; print(webview.__file__)"
      - name: pure desktop tests (no window)
        run: uv run pytest -q tests/test_desktop.py tests/test_messages.py
