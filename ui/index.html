<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>kuulas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <!-- Layout and every class here: docs/design/GUI-DESIGN.md ("Main window"),
       visual reference docs/design/prototype/index.html. -->
  <body>
    <div class="editor">
      <header class="toolbar" role="toolbar" data-i18n-aria-label="ui.toolbar.label">
        <div class="project"><img class="brand-mark" src="/logo.svg" alt="" width="26" height="26" /><span class="name" data-i18n="ui.app.name"></span></div>
        <nav id="menubar" class="menubar"></nav>
        <div class="modes">
          <span id="live-chip" class="chip danger" role="status" hidden></span>
          <!-- While a take records (record-view.js): opens the record view; the take never stops here. -->
          <button id="rec-chip" type="button" class="chip danger rec-chip" hidden></button>
          <button id="waveform-gain" type="button" class="chip warn" hidden></button>
        </div>
        <span class="spacer"></span>
        <input id="file-input" type="file" accept="audio/*,video/*" multiple hidden />
      </header>
      <aside class="heads">
        <!-- The transport corner (owner, 2026-10-18, variant C-right): Play, timecode, loop and
             fast listening sit above the track headers, level with the overview and the ruler.
             Mockup: docs/design/transport-corner/index.html. -->
        <div class="corner" role="toolbar" data-i18n-aria-label="ui.transport.label">
          <button id="play" type="button" class="play" aria-keyshortcuts="Space">
            <span id="play-icon" class="play-icon" aria-hidden="true">▶</span><span id="play-label" class="lbl"></span>
            <kbd data-shortcut="Space" aria-hidden="true"></kbd>
          </button>
          <!-- Record: the same size as Play; opens the record view (Transport > Record…). -->
          <button id="record" type="button" class="play rec-button" data-i18n-title="cmd.transport.record.hint">
            <span class="play-icon rec-dot" aria-hidden="true">●</span><span class="lbl" data-i18n="ui.transport.record"></span>
          </button>
          <div class="t-row">
            <button id="loop" type="button" class="button ghost icon" aria-pressed="false" aria-keyshortcuts="Meta+U Control+U">
              <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5v-1a2.5 2.5 0 0 1 2.5-2.5h7.5M10.5 1.8 12.7 4l-2.2 2.2M13.5 8.5v1A2.5 2.5 0 0 1 11 12H3.5M5.5 14.2 3.3 12l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="loop-name visually-hidden" data-i18n="ui.transport.loop"></span>
            </button>
            <input id="fast-speed" class="fast-speed" type="range" min="1" max="2" step="0.05" value="1.5" data-i18n-aria-label="ui.speed.slider" data-i18n-title="ui.speed.slider" />
            <button id="speed-chip" type="button" class="chip warn" hidden></button>
          </div>
        </div>
        <div id="track-headers" data-help-id="track-headers" class="heads-scroll" data-i18n-aria-label="ui.focus.tracks"></div>
      </aside>
      <section class="tl-column" data-panel="timeline">
        <canvas id="overview" class="overview" data-i18n-aria-label="ui.overview.label" role="img"></canvas>
        <div id="timeline-stack" class="timeline-stack">
          <canvas id="wave" class="layer" aria-hidden="true"></canvas>
          <canvas id="timeline" class="layer" tabindex="0" role="application" data-i18n-aria-label="ui.timeline.label"></canvas>
          <div id="lanes-scroll" class="lanes-scroll" aria-hidden="true" hidden><div class="lanes-thumb"></div></div>
          <p id="empty" class="empty" hidden></p>
        </div>
      </section>
      <section id="panel-transcript" class="panel dock" data-panel="transcript" tabindex="0" data-i18n-aria-label="ui.focus.transcript">
        <h2 data-i18n="ui.focus.transcript"></h2>
      </section>
      <!-- The transport numbers (owner, 2026-10-19): the clock and Alku / Loppu / Pituus sit in the
           free column left of the transcript text, over the dock's cell (the dock scrolls, they do
           not). marks-corner.js draws and wires the three rows; clock.js the clock. -->
      <div class="tx-numbers" role="group" data-i18n-aria-label="ui.transport.numbers">
        <output id="timecode" class="timecode" data-i18n-aria-label="ui.transport.time">0:00.000</output>
        <div class="rcol" role="group" data-i18n-aria-label="ui.range.group">
          <button id="mark-in" type="button" class="mrow"></button>
          <button id="mark-out" type="button" class="mrow"></button>
          <button id="mark-length" type="button" class="mrow"></button>
        </div>
      </div>
      <aside class="sidebar">
        <!-- Help (F1): docked over the sidebar's panels while open; help-panel.js fills it. -->
        <section id="panel-help" class="panel help-panel" data-panel="help" tabindex="-1" hidden></section>
        <!-- Auto-Silence options (Track > Auto): docked over the sidebar's panels the same way while
             open, so the lanes stay visible and clickable; silence-panel.js fills it. -->
        <section id="panel-silence" class="panel silence-panel" data-panel="silence" hidden></section>
        <div class="side-tabs" role="tablist" data-i18n-aria-label="ui.tabs.label">
          <button id="tab-inspector" type="button" role="tab" class="side-tab" data-tab="inspector" aria-controls="panel-inspector" data-i18n="ui.tabs.inspector"></button>
          <button id="tab-candidates" type="button" role="tab" class="side-tab" data-tab="candidates" aria-controls="panel-candidates"><span data-i18n="ui.tabs.candidates"></span><span id="cand-count" class="count" hidden></span></button>
          <button id="tab-clipboard" type="button" role="tab" class="side-tab" data-tab="clipboard" aria-controls="panel-clipboard" data-i18n="ui.tabs.clipboard"></button>
          <button id="tab-markers" type="button" role="tab" class="side-tab" data-tab="markers" aria-controls="panel-markers" data-i18n="ui.tabs.markers"></button>
          <button id="tab-history" type="button" role="tab" class="side-tab" data-tab="history" aria-controls="panel-history" data-i18n="ui.tabs.history"></button>
          <!-- Hides the whole side panel (View > Show side panel brings it back). -->
          <button id="side-close" type="button" class="button ghost icon side-close" data-icon="close" data-i18n-aria-label="ui.sidebar.close" data-i18n-title="ui.sidebar.close"></button>
        </div>
        <section id="panel-inspector" data-help-id="inspector" class="panel" data-panel="inspector" role="tabpanel" aria-labelledby="tab-inspector" tabindex="0"></section>
        <section id="panel-candidates" class="panel" data-panel="candidates" role="tabpanel" aria-labelledby="tab-candidates" tabindex="0" hidden></section>
        <section id="panel-clipboard" class="panel" data-panel="clipboard" role="tabpanel" aria-labelledby="tab-clipboard" tabindex="0" hidden></section>
        <section id="panel-markers" class="panel" data-panel="markers" role="tabpanel" aria-labelledby="tab-markers" tabindex="0" hidden></section>
        <section id="panel-history" class="panel" data-panel="history" role="tabpanel" aria-labelledby="tab-history" tabindex="0" hidden></section>
      </aside>
      <footer class="statusbar" data-i18n-aria-label="ui.view.title">
        <span id="zoom-chip" class="zoom"></span>
        <button id="view-toggle" data-help-id="view-toggle" type="button" class="button ghost" data-i18n-title="ui.view.toggle" aria-keyshortcuts="Z"></button>
        <span class="divider" aria-hidden="true"></span>
        <!-- At most three hints, for the focused panel (GUI-DESIGN.md "Density"). -->
        <span id="keyhints" class="keyhints" aria-hidden="true"></span>
        <span id="menu-hint" class="keyhints menu-hint" role="status" hidden></span>
        <span id="range-info" class="range-info" role="status" hidden></span>
        <button id="scope-chip" type="button" class="chip scope-chip" data-help-id="scope-chip" aria-keyshortcuts="E" hidden></button>
        <span id="tab-scope" class="range-info tab-scope" data-i18n-title="cmd.nav.tab_target_cycle.hint"></span>
        <span class="spacer"></span>
        <!-- The live level meter (level-meter.js): what plays now, dBFS, two thin bars with a
             peak-hold tick; hidden while stopped, except the clip light, which stays until clicked. -->
        <span id="level-meter" class="level-meter" hidden>
          <span id="level-bars" class="lm-bars" role="img" data-i18n-aria-label="ui.meter.title" data-i18n-title="ui.meter.title">
            <span class="lm-row"><i class="lm-fill" data-zone="ok"></i><i class="lm-fill" data-zone="warn"></i><i class="lm-fill" data-zone="hot"></i><i class="lm-hold"></i></span>
            <span class="lm-row"><i class="lm-fill" data-zone="ok"></i><i class="lm-fill" data-zone="warn"></i><i class="lm-fill" data-zone="hot"></i><i class="lm-hold"></i></span>
            <i class="lm-tick" data-db="-18"></i><i class="lm-tick" data-db="-6"></i>
          </span>
          <button id="level-clip" type="button" class="lm-clip" hidden data-i18n-aria-label="ui.meter.clip" data-i18n-title="ui.meter.clip"></button>
        </span>
        <span id="build-label" class="range-info build-label" data-i18n-title="ui.build.title"></span>
        <button id="help-button" data-help-id="help-button" type="button" class="button ghost" data-icon="help" data-i18n="ui.help.title" aria-keyshortcuts="F1"></button>
        <button id="view-menu-button" data-help-id="view-menu" type="button" class="button ghost" data-icon="menu" popovertarget="view-menu" data-i18n="ui.view.menu"></button>
      </footer>
      <!-- Everything else about the view: one click away, not on screen at rest. -->
      <div id="view-menu" class="view-menu" popover data-i18n-aria-label="ui.view.menu">
        <div class="menu-row"><span data-i18n="ui.view.zoom"></span>
          <span class="menu-pair">
            <button id="zoom-out" type="button" class="button icon" data-i18n-aria-label="ui.view.zoom_out" data-i18n-title="ui.view.zoom_out" aria-keyshortcuts="-">−</button>
            <button id="zoom-in" type="button" class="button icon" data-i18n-aria-label="ui.view.zoom_in" data-i18n-title="ui.view.zoom_in" aria-keyshortcuts="=">+</button>
          </span>
        </div>
        <button id="fit" type="button" class="button" data-icon="fit" data-i18n="ui.view.fit" aria-keyshortcuts="Shift+Z"></button>
        <label class="menu-row"><span data-i18n="ui.view.waveform"></span>
          <select id="waveform-mode" class="button">
            <option value="half" data-i18n="ui.view.half"></option>
            <option value="full" data-i18n="ui.view.classic"></option>
          </select>
        </label>
        <div class="menu-row"><span data-i18n="ui.view.lanes"></span>
          <span class="menu-pair">
            <button id="lane-shorter" type="button" class="button icon" data-i18n-aria-label="ui.view.lane_shorter" data-i18n-title="ui.view.lane_shorter">−</button>
            <button id="lane-taller" type="button" class="button icon" data-i18n-aria-label="ui.view.lane_taller" data-i18n-title="ui.view.lane_taller">+</button>
          </span>
        </div>
        <button id="follow" type="button" class="button" data-icon="follow" data-i18n-title="ui.view.follow_title"></button>
        <label class="menu-row"><span data-i18n="ui.view.gates"></span>
          <input id="show-gates" type="checkbox" checked />
        </label>
        <label class="menu-row"><span data-i18n="ui.density.title"></span>
          <select id="density" class="button">
            <option value="comfortable" data-i18n="ui.density.comfortable"></option>
            <option value="compact" data-i18n="ui.density.compact"></option>
          </select>
        </label>
        <label class="menu-row"><span data-i18n="ui.motion.title"></span>
          <select id="motion" class="button">
            <option value="full" data-i18n="ui.motion.full"></option>
            <option value="subtle" data-i18n="ui.motion.subtle"></option>
            <option value="off" data-i18n="ui.motion.off"></option>
          </select>
        </label>
        <button id="theme" type="button" class="button" data-icon="theme"></button>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden>
        <span id="notice-text"></span>
        <div id="notice-rich" class="notice-rich" hidden>
          <div class="nr-head">
            <span id="nr-title" class="nr-title"></span>
            <span id="nr-eta" class="nr-eta"></span>
            <span id="nr-percent" class="nr-percent"></span>
          </div>
          <div id="nr-bar" class="nr-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-aria-label="ui.automix.toast.bar"><div id="nr-fill" class="nr-fill"></div></div>
          <div class="nr-line nr-line-phase">
            <span id="nr-phase" class="nr-phase"></span>
            <span id="nr-step" class="nr-step"></span>
          </div>
          <div class="nr-line nr-line-detail">
            <span id="nr-track" class="nr-track"></span>
            <span id="nr-name" class="nr-name"></span>
            <span id="nr-note" class="nr-note"></span>
            <span id="nr-stage" class="nr-stage"></span>
            <span id="nr-count" class="nr-count"></span>
            <span id="nr-pips" class="nr-pips" aria-hidden="true"></span>
          </div>
        </div>
        <button id="notice-action"type="button" class="button" hidden></button>
        <button id="notice-action2" type="button" class="button" hidden></button>
        <button id="notice-undo" type="button" class="button" data-icon="undo" data-i18n="ui.transport.undo" hidden></button>
        <button id="notice-close" type="button" class="button ghost icon" data-i18n-aria-label="ui.notice.dismiss" data-i18n-title="ui.notice.dismiss">×</button>
      </div>
      <div id="notice-live" class="visually-hidden" aria-live="polite"></div>
      <div id="import-panel" class="import-panel" role="status" aria-live="polite" hidden></div>
      <div id="placeholder-editor" class="import-panel placeholder-editor" role="dialog" aria-modal="false" aria-labelledby="placeholder-editor-title" hidden></div>
      <div id="drop" class="drop" aria-hidden="true" hidden><span data-i18n="ui.import.drop"></span></div>
    </div>
  </body>
</html>
