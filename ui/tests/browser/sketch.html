<!doctype html>
<html lang="fi" data-density="comfortable" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
    <style id="stage-css">
      html, body { margin: 0; background: #101218; }
      .stage {
        position: relative;
        width: 640px;
        height: 330px;
        overflow: hidden;
        background: #101218;
        font-family: system-ui, sans-serif;
      }
      .lane {
        position: absolute;
        left: 0;
        right: 0;
        background: #1c1f28;
        border-top: 1px solid #2a2e3a;
        overflow: hidden;
      }
      .lane svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .lane .clip {
        position: absolute;
        left: 40px;
        width: 480px;
        top: 22%;
        height: 56%;
        border-radius: 6px;
        background: rgba(214, 106, 143, 0.28);
        border: 1px solid rgba(214, 106, 143, 0.55);
      }
      .tl-column { position: absolute; inset: 0; }
      .tl-column .lane { z-index: 0; }
      #track-headers { position: absolute; inset: 0; }
      .variant-tag {
        position: absolute;
        right: 10px;
        bottom: 8px;
        font: 600 12px system-ui;
        color: #8b90a0;
        letter-spacing: 0.06em;
      }

      /* --- collapsed strip: second read-only state column (his idea) --- */
      .th-strip .th-strip-pair { display: flex; gap: 3px; align-items: center; }
      .th-state { display: flex; flex-direction: column; gap: 3px; }
      .th-state span {
        width: 22px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: #9aa0b0;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }

      /* --- shared multi-row plumbing (expanded variants) --- */
      .mr-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .mr-row .track-name {
        flex: 0 1 auto;
        max-width: 230px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: none;
        border: 0;
        box-shadow: none;
        padding: 0;
        font-weight: 600;
        font-size: 13px;
        color: #e6e8ee;
        text-align: left;
      }
      .mr-row .ms { display: flex; flex-direction: row; gap: 4px; }
      .mr-row .ms-button, .th-strip .ms-button {
        width: 24px; height: 20px; padding: 0; font-size: 11px;
        border-radius: 5px;
        border: 1px solid #3a3e4c;
        background: #262a35;
        color: #cfd3de;
      }
      .mr-row .th-disclosure {
        width: 22px; height: 20px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 5px;
        border: 1px solid #3a3e4c;
        background: #262a35;
        color: #cfd3de;
      }
      .mr-row .track-compact-summary {
        display: block;
        margin-left: auto;
        font-size: 11px;
        color: #9aa0b0;
        white-space: nowrap;
      }
      /* expanded card always on for the sketch target */
      .track-header.hover-open .th-card {
        background: rgba(35, 38, 47, 0.96);
        border: 1px solid #3a3e4c;
        box-shadow: 0 6px 18px rgba(0,0,0,0.45);
        border-radius: 16px;
        padding: 7px 12px;
        gap: 6px;
      }
      .track-header.hover-open .th-card .th-controls { display: flex !important; gap: 8px; align-items: flex-end; }
      /* collapsed strip grows for the state column */
      .th-strip { width: auto; }
      .th-card .th-controls .slider-control.control-gain { flex: none; width: 168px; }
      .th-card .slider-control.pan { flex: none; width: 28px; }
      .th-card .slider-caption { font-size: 10px; font-weight: 600; color: #9aa0b0; }
      .th-card .slider-control output { font-size: 10px; color: #cfd3de; }
    </style>
    <style id="variant-css"></style>
  </head>
  <body>
    <div class="stage">
      <section class="tl-column">
        <div id="track-headers" class="heads-scroll"></div>
      </section>
      <div class="variant-tag" id="vtag"></div>
    </div>
    <script type="module" src="/tests/browser/sketch.js"></script>
  </body>
</html>
